plugin_type = "crawler"
id = "019d0000-0000-7000-8000-000000000161"
name = "pCloud folders"
version = "0.1.14"

# pCloud's two installations and nothing else. `listfolder` and `showpublink` live there, and
# the account's access token may be sent to them and to no other address.
[capabilities]
secrets = ["pcloud_access_token"]

[capabilities.net_http]
domains = ["api.pcloud.com", "eapi.pcloud.com"]

[extension]
slug = "pcloud_crawler"
# The provider whose account this crawler runs as. The row itself is declared by the sibling
# resolver, because only a resolver manifest may carry one; the host looks the account up and
# this plugin never learns which one it is, nor sees its token.
claims = ["pcloud"]

[metadata]
description = "Lists the files behind a pCloud folder or public link."

[limits]
memory_bytes = 33554432
# A crawl walks a tree in one invocation, so it needs more room than a call that makes one
# request. The walk in `src/walk.rs` bounds depth, breadth and cycles; these bound a runaway.
timeout_milliseconds = 30000
