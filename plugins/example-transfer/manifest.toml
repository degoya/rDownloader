plugin_type = "transfer"
id = "019d0000-0000-7000-8000-0000000000e1"
name = "Example Transfer"
version = "0.7.10"
# One transfer at a time: this backend exists to demonstrate the contract, not to move data.
max_concurrent_downloads = 1

[capabilities]

# The reference backend ships with no host it may actually reach. It is built to be driven by
# the contract tests, which supply their own allowlist along with the port their server bound
# to; shipping a usable one would mean shipping a plugin that dials somebody's machine.
[capabilities.net_stream]
hosts = ["example.invalid"]
ports = [8721]

[transfer]
slug = "example"
schemes = ["example+tcp", "example+tls"]

[metadata]
description = "Reference transfer backend demonstrating the plugin transfer contract."
