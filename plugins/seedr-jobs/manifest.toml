manifest_version = 3
plugin_type = "remote-job"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000181"
name = "Seedr transfers"
version = "0.1.3"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

[capabilities]
# The account password, the same slot the resolver sibling reads. It is read back here only
# inside the template `{{basic:seedr_password}}`, never as a value: the host pairs it with the
# account's e-mail address and encodes the two on the way out.
secrets = ["seedr_password"]

# The provider's own API, and nothing else. The addresses a finished transfer produces are on
# this same host and are fetched by the transfer engine, not from in here.
[capabilities.net_http]
domains = ["www.seedr.cc"]

[extension]
slug = "seedr_jobs"
# The provider whose account these transfers run on. The host looks the account up; this plugin
# never learns which one it is, and never sees its credential.
claims = ["seedr"]

[metadata]
description = "Runs magnets and torrent files as transfers on a Seedr account."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "1.2.0"

[limits]
memory_bytes = 33554432
# Every call here returns on the provider's next answer -- the waiting belongs to the host --
# so this needs far less room than a crawler walking a tree. The one memory-shaped operation is
# reading a finished transfer's folder, which `api::MAX_ENTRIES`, `api::MAX_DEPTH` and
# `api::MAX_LISTINGS` bound together before anything crosses the boundary.
fuel = 500000000
timeout_milliseconds = 15000
max_response_bytes = 8388608
