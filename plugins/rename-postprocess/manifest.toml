manifest_version = 3
plugin_type = "postprocess"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000109"
name = "Tidy file names"
version = "0.9.5"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

# Nothing granted. Renaming inside the package is part of what a post-processing step is, and
# the host hands over a handle and a file list, never a path — a name carrying a separator or
# a `..` is refused there, not here.
[capabilities]

[extension]
slug = "rename_postprocess"
# Empty: a step is switched on per category, not matched against a link.
claims = []

[metadata]
description = "Replaces spaces with dots and collapses runs of separators in the package's file names."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.9.2"

[limits]
memory_bytes = 33554432
fuel = 500000000
# Renaming touches metadata rather than content, so this is far below the checksum steps.
timeout_milliseconds = 60000
max_response_bytes = 1048576
