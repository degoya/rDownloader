[package]
name = "rd-plugin-md5-postprocess"
version = "1.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
checksum-postprocess-common = { path = "../checksum-postprocess-common" }
md-5.workspace = true

[dev-dependencies]
plugin-common = { path = "../common" }

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

# The package is `md-5`, the library `md5`; cargo-machete looks for the former.
[package.metadata.cargo-machete]
ignored = ["md-5"]
