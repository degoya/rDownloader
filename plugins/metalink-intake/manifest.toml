plugin_type = "intake"
id = "019d0000-0000-7000-8000-000000000101"
name = "Metalink"
version = "0.10.10"

# Nothing granted. The parser reads the text it is handed and answers; a metalink carries
# every address it needs, so there is nothing to fetch and no reason to reach the network.
[capabilities]

[extension]
slug = "metalink_intake"
# Empty: the format is recognised from the document, not from where it came from.
claims = []

[metadata]
description = "Reads Metalink documents (.metalink, .meta4) and proposes the files they list."

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 5000
max_response_bytes = 1048576
