manifest_version = 3
plugin_type = "oauth"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000162"
name = "pCloud sign-in"
version = "0.1.3"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

# Redirect only. pCloud has no device flow; the authorization code against its own
# authorization page is the whole of what it offers.
oauth_flows = ["redirect"]

[capabilities]
# The secret of the application the person registered with pCloud. It is theirs, it is stored
# on their account, and this plugin only ever names it — the host substitutes the value on the
# way out and hands it back to nobody. Deliberately not `pcloud_access_token`: this plugin
# writes that one through `store-oauth-token` and has no business reading it back.
secrets = ["pcloud_client_secret"]

# pCloud's authorization page, and both of its token endpoints. `my.pcloud.com` is where the
# person agrees — pCloud serves one authorization page for both installations and states which
# one the account belongs to in the redirect — and the code is redeemed at whichever of the two
# API hosts issued it. The first of these is also what bounds the sign-in page a person can be
# sent to.
[capabilities.net_http]
domains = ["my.pcloud.com", "api.pcloud.com", "eapi.pcloud.com"]

[extension]
slug = "pcloud_oauth"
# One provider: the row `plugins/pcloud/` declares. The host looks the account up and this
# plugin never learns which one it is.
claims = ["pcloud"]

[metadata]
description = "Signs a pCloud account in through pCloud's own authorization endpoint."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "1.1.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 15000
max_response_bytes = 1048576
