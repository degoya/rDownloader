manifest_version = 3
plugin_type = "auth"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000122"
name = "TorBox sign-in"
version = "0.1.3"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

[capabilities]
# The API key the person pasted. This plugin checks it; it never obtains one and never stores
# one. `credentials::store-token` is imported by the world and deliberately not called.
secrets = ["torbox_api_key"]

# The provider's own API, and nothing else. This list is also what bounds the address the
# plugin may ask a person to visit: a page outside it is refused by the host.
[capabilities.net_http]
domains = ["api.torbox.app"]

[extension]
slug = "torbox_auth"
# One provider. Which plugin signs an account in is decided by this.
claims = ["torbox"]

[metadata]
description = "Checks a TorBox API key against the account and says what the plan is worth."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.9.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 15000
max_response_bytes = 262144
