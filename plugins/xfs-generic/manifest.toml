[metadata]
description = "Resolves links on XFileSharing installations through the free flow, without an account."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.9.8"

[provider]
slug = "xfs_generic"
kind = "hoster"
credentials = "none"
username_required = false

[limits]
memory_bytes = 67108864
fuel = 2000000000
timeout_milliseconds = 15000
max_response_bytes = 8388608
# A free download waits out the clone's countdown and one captcha round trip; this budget is
# spent on waiting only and does not extend the compute timeout above.
wait_budget_milliseconds = 600000
