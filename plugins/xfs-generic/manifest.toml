# ---------------------------------------------------------------------------------------------
# The domain list holds clones that were checked, and grows from there (RD-098-01).
#
# A claimed domain is a promise. A resolver that claims one and then fails turns a plain HTTP
# download into a hoster error, so nothing goes in here on hearsay. Every host below cleared two
# independent checks:
#
# 1. JDownloader models the site as a stock XFileSharing installation — its plugin class extends
#    `XFileSharingProBasic`. 315 of JD's hoster plugins do, naming 682 domains through
#    `getPluginDomains()`; JD's own `getDeadDomains()` marked 90 of those as gone and they are
#    not here.
# 2. The site answered `https://<host>/login.html` with the XFS login form (`<form name="FL">`
#    carrying `op=login`), checked 2026-09-06 with ddownload.com as a positive control. 582
#    candidates were probed and 371 failed — dead, moved, or never XFS — leaving the 140 sites
#    and 140 domains below.
#
# What neither check proves is that this plugin's free flow completes on a given site, and that
# is deliberate rather than overlooked. Measured against JD's own subclasses, ignoring the five
# tuning overrides (chunks, resume, parallelism) that 138 of them carry: 48 sites deviate from
# the base flow in nothing at all, 75 in at most one thing, and the remainder needed real
# per-site work in JD. So the far end of this list is where a failure is likeliest — and it
# fails with a named cause, which is the report a user can act on. A site nobody claims is a
# site nobody can report.
#
# Hosts already served by one of this application's own resolvers are excluded, or two providers
# would fight over the same links: ddownload and katfile, with their aliases.
#
# Video and image hosts are in here because XFS powers many of them. They do not take links away
# from the media or gallery pipelines: link intake asks those first, and their host lists are
# user-editable, so a host listed there keeps going to yt-dlp or gallery-dl.
#
# All four lists have to agree, and two tests in `src/lib.rs` enforce it: `match_domains` decides
# which links this plugin is routed, the `HOSTERS` constant is what `matches()` actually consults,
# `download_domains` bounds what a transfer may reach, and `capabilities.net_http.domains` is the
# sandbox boundary on every request. The wildcard entries cover the delivery subdomains XFS
# installations hand files to; a clone delivering from an unrelated CDN needs that CDN added, and
# until then the resolved URL is refused rather than followed — an error, never a wrong download.
#
# Packaging additionally waits on the application version: `min_app_version` below is 0.9.8
# because `credentials = "none"` is new in that release, while the workspace version only moves
# in the release commit. `scripts/build-plugins.sh --list-packageable` skips this plugin until
# then; building it is unaffected.
# ---------------------------------------------------------------------------------------------
