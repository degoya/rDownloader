[package]
name = "rd-plugin-xfs-generic"
version = "1.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The free flow is HTML page scraping end to end — no JSON API is involved, because the account
# API is exactly the part this plugin does not have. `serde`/`serde_json` would be dead weight,
# as in `plugins/filejoker`, and are left out.
[dependencies]
url.workspace = true
wit-bindgen.workspace = true
plugin-common = { path = "../common" }
plugin-guest = { path = "../guest" }
xfs-common = { path = "../xfs-common" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait.workspace = true
rd-core = { path = "../../crates/rd-core" }
rd-plugin-api = { path = "../../crates/rd-plugin-api" }
uuid.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[package.metadata.component]
package = "rdownloader:xfs-generic"

[package.metadata.component.target]
path = "../../crates/rd-plugin-api/wit"
world = "resolver-plugin"

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
