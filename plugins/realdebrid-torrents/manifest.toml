manifest_version = 3
plugin_type = "remote-job"
api_version = "0.10.0"
id = "019d0000-0000-7000-8000-00000000011d"
name = "Real-Debrid torrents"
version = "0.2.6"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

[capabilities]
# The account's token, the same two slots the resolver sibling reads (RD-150-09): the access
# token of a sign-in with a code, or the private API token the person typed. Read here only as
# the template `{{secret:<reference>}}`, never as a value; the host answers `secret-available`
# for the one the account's mode makes live.
secrets = ["realdebrid_access_token", "realdebrid_api_token"]

# The provider's own API, and nothing else. `torrents/*` lives here.
[capabilities.net_http]
domains = ["api.real-debrid.com"]

[extension]
slug = "realdebrid_torrents"
# The provider whose account these jobs run on. The host looks the account up; this plugin
# never learns which one it is, and never sees its token.
claims = ["realdebrid"]
# The container formats this provider takes, read by the host without compiling the plugin:
# the LinkGrabber offers an NZB only to accounts whose plugin names `nzb` here (RD-191-13).
containers = ["torrent"]

[metadata]
description = "Runs magnets and torrent files as jobs on a Real-Debrid account."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
# The `remote-job` world does not exist before 1.0.7; an older host could not load this.
min_app_version = "1.0.7"

[limits]
memory_bytes = 33554432
# Every call here makes at most two requests and returns on the provider's next answer -- the
# waiting belongs to the host -- so this needs far less room than a crawler walking a tree.
# The one memory-shaped operation is reading a container to find its info hash, which
# `source::MAX_CONTAINER_BYTES` (`torrent_common`'s) bounds at eight MiB before any of this is
# reached.
fuel = 500000000
timeout_milliseconds = 15000
max_response_bytes = 8388608
