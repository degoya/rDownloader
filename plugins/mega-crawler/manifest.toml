manifest_version = 3
plugin_type = "crawler"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000133"
name = "MEGA folders"
version = "0.1.4"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

# Only the command endpoint: a folder listing is one call and names no storage node.
[capabilities.net_http]
domains = ["g.api.mega.co.nz", "mega.nz"]

[capabilities]
# A folder in the signed-in account is listed with the session the sign-in stored, and its
# files' names are sealed under keys wrapped under the account's master key (RD-120-30). The
# token is sent as `{{secret:mega_session}}`; the host unwraps each node key under the key half
# and hands back only that node's key. Everything this plugin reaches is a host the session
# itself may be sent to, which is the condition for computing over it at all.
secrets = ["mega_session"]
key_derivation = true

[extension]
slug = "mega_crawler"
claims = ["mega"]

[metadata]
description = "Lists the files behind a public MEGA folder link or a folder of the signed-in account, with names, sizes and structure."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "1.1.0"

[limits]
memory_bytes = 67108864
fuel = 1000000000
timeout_milliseconds = 30000
max_response_bytes = 16777216
