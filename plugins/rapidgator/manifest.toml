manifest_version = 3
plugin_type = "resolver"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000003"
name = "Rapidgator"
# 0.3.0: free (account-less) downloads. The version must rise, or a running instance keeps
# the installed package (`sync_bundled` only installs newer ones) and never picks the free
# flow up. Pinned jobs are unaffected: the older version stays installed.
version = "0.7.4"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="
match_domains = [
  "rapidgator.net",
  "www.rapidgator.net",
  "rg.to",
  "www.rg.to",
  "rapidgator.asia",
  "www.rapidgator.asia",
]
download_domains = ["rapidgator.net", "*.rapidgator.net"]
max_concurrent_downloads = 5
# Links without an account are served by the website free flow (file page -> server-side
# countdown -> reCAPTCHA + wait -> /download/captcha -> download link). Every host it contacts is
# already covered by `domains`: JD's `getContentURL` rewrites the rg.to/rapidgator.asia aliases
# to the main domain before the first request, and the final link lives on a
# `*.rapidgator.net` subdomain.
requires_account = false

[capabilities]
captcha = true
secrets = ["rapidgator_password"]

[capabilities.net_http]
domains = ["rapidgator.net", "*.rapidgator.net"]

[metadata]
description = "Resolves Rapidgator links with a premium account, or without one via the free flow."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.7.0"

[provider]
slug = "rapidgator"
kind = "hoster"
credentials = "username_password"
username_required = true
secret_reference = "rapidgator_password"
secret_domains = ["rapidgator.net"]
host_aliases = [
  ["rg.to", "rapidgator.net"],
  ["rapidgator.asia", "rapidgator.net"],
]
[limits]
memory_bytes = 67108864
fuel = 2000000000
timeout_milliseconds = 15000
max_response_bytes = 8388608
# A free download waits out the hoster's countdown and one captcha round trip; this budget is
# spent on waiting only and does not extend the compute timeout above.
wait_budget_milliseconds = 600000
