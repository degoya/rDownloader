plugin_type = "auth"
id = "019d0000-0000-7000-8000-00000000010a"
name = "Debrid-Link sign-in"
version = "0.9.14"

# The provider's own API, and nothing else. This list is also what bounds the address the
# plugin may ask a person to visit: a sign-in page outside it is refused by the host.
[capabilities.net_http]
domains = ["debrid-link.com", "api.debrid-link.com"]

[extension]
slug = "debridlink_auth"
# One provider. Which plugin signs an account in is decided by this.
claims = ["debridlink"]

[metadata]
description = "Signs a Debrid-Link account in through the provider, without an API key being typed here."

[limits]
memory_bytes = 33554432
fuel = 500000000
max_response_bytes = 262144
