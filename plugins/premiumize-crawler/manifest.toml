plugin_type = "crawler"
id = "019d0000-0000-7000-8000-00000000010f"
name = "Premiumize folders"
version = "0.1.14"

# The provider's own API, and nothing else. `folder/list` and `item/details` live here, and
# the account's API key may be sent to `www.premiumize.me` and to no other address.
[capabilities]
secrets = ["premiumize_api_key"]

[capabilities.net_http]
domains = ["www.premiumize.me", "premiumize.me"]

[extension]
slug = "premiumize_crawler"
# The provider whose account this crawler runs as. The host looks the account up; this plugin
# never learns which one it is, and never sees its key.
claims = ["premiumize"]

[metadata]
description = "Lists the files behind a Premiumize.me cloud folder or item address."

[limits]
memory_bytes = 33554432
# A crawl walks a tree in one invocation, so it needs more room than a call that makes one
# request. The walk in `src/walk.rs` bounds depth, breadth and cycles; these bound a runaway.
timeout_milliseconds = 30000
max_response_bytes = 4194304
