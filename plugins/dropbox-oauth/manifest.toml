manifest_version = 3
plugin_type = "oauth"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000119"
name = "Dropbox sign-in"
version = "0.1.3"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

# Redirect only. Dropbox has no device flow; authorization code with PKCE against its own
# authorization page is the whole of what it offers a public client.
oauth_flows = ["redirect"]

# Dropbox's own two endpoints, and nothing else. `www.dropbox.com` is where the person agrees;
# `api.dropboxapi.com` is where the code and the refresh material are exchanged. The first is
# also what bounds the sign-in page a person can be sent to.
[capabilities.net_http]
domains = ["www.dropbox.com", "api.dropboxapi.com"]

[extension]
slug = "dropbox_oauth"
# One provider: the row `plugins/dropbox/` declares. The host looks the account up and this
# plugin never learns which one it is.
claims = ["dropbox"]

[metadata]
description = "Signs a Dropbox account in through Dropbox's own authorization endpoint."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "1.0.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 15000
max_response_bytes = 1048576
