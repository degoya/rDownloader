[package]
name = "plugin-common"
version = "1.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The neutral types, the trait and the executor depend on nothing at all: that is what lets one
# piece of hoster logic be compiled for both targets.

# The native adapter is the one part that must know the application's vocabulary, so it is the
# one part gated to the host target. Nothing under `wasm32` pulls any of this.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono.workspace = true
rand.workspace = true
rd-core = { path = "../../crates/rd-core" }
url.workspace = true
rd-plugin-api = { path = "../../crates/rd-plugin-api" }
tracing.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true
