[package]
name = "rd-plugin-krakenfiles"
version = "1.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
url.workspace = true
plugin-common = { path = "../common" }
plugin-guest = { path = "../guest" }
xfs-common = { path = "../xfs-common" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait.workspace = true
rd-plugin-api = { path = "../../crates/rd-plugin-api" }
rd-plugin-types = { path = "../../crates/rd-plugin-types" }

[lib]
crate-type = ["rlib"]

[dev-dependencies]
rd-plugin-api = { path = "../../crates/rd-plugin-api", features = ["test-support"] }
tokio.workspace = true
toml.workspace = true

[lints]
workspace = true
