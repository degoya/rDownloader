plugin_type = "crawler"
id = "019d0000-0000-7000-8000-00000000011c"
name = "Nextcloud shares"
version = "0.1.15"

# A Nextcloud is wherever somebody put theirs, so there is no domain that could stand here.
# The grant that actually applies is narrower than this line: the host builds the store for
# one crawl and narrows it to the host of the address that was pasted, so `*` reads as
# "wherever the address points" and a redirect off that host is refused exactly as before
# (RD-107-05, `extension::crawl_host`).
[capabilities.net_http]
domains = ["*"]

[extension]
slug = "nextcloud_crawler"
# No provider and no account: a public share needs neither. An account against a self-hosted
# instance is an `auth` plugin and a separate decision.
claims = []

[metadata]
description = "Lists the files behind a public Nextcloud or ownCloud folder share."

[limits]
memory_bytes = 33554432
# A crawl walks a tree in one invocation, so it needs more room than a call that makes one
# request. The walk in `src/walk.rs` bounds depth, breadth and repeats; these bound a runaway.
timeout_milliseconds = 30000
# A `PROPFIND` answer carries one XML element per entry, so a wide folder is a large document.
max_response_bytes = 4194304
