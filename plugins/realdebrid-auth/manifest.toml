manifest_version = 3
plugin_type = "oauth"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000113"
name = "Real-Debrid sign-in"
version = "0.2.3"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

# Device code and nothing else. Real-Debrid's open-source flow has no redirect entrance, so
# naming `redirect` here would only earn a refusal — and because the host reads this before it
# calls anything, `begin` and `poll` are never asked for.
oauth_flows = ["device"]

[capabilities]
# The personal client id and client secret Real-Debrid's open-source device flow hands out
# (RD-150-09). This plugin reads them once off the provider's answer, hands them to the host
# through `store-flow-secret` and from then on only names them -- the host substitutes the values
# on the way out and hands them back to nobody. The public client id the flow starts with is no
# secret and stands in the code.
secrets = ["realdebrid_client_id", "realdebrid_client_secret"]

# The provider's own API, and nothing else. This list is also what bounds the address the
# plugin may ask a person to visit: a sign-in page outside it is refused by the host.
[capabilities.net_http]
domains = ["api.real-debrid.com", "real-debrid.com", "www.real-debrid.com"]

[extension]
slug = "realdebrid_auth"
# The Real-Debrid provider's "Connect with a code" mode (RD-150-09). An account in its "API token"
# mode is never signed in: the accounts form offers no sign-in for it.
claims = ["realdebrid"]

[metadata]
description = "Signs a Real-Debrid account in with a code, and keeps the sign-in renewed."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.9.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 15000
max_response_bytes = 262144
