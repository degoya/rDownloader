manifest_version = 3
plugin_type = "oauth"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000113"
name = "Real-Debrid sign-in"
version = "0.1.3"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

# Device code and nothing else. Real-Debrid's OAuth2 has no redirect entrance for an
# application like this one, so naming `redirect` here would only earn a refusal — and because
# the host reads this before it calls anything, `begin` and `poll` are never asked for.
oauth_flows = ["device"]

[capabilities]
# The client secret of the application the person registered at Real-Debrid. It is theirs, it
# is stored on their account, and this plugin only ever names it -- the host substitutes the
# value on the way out and hands it back to nobody.
secrets = ["realdebrid_client_secret"]

# The provider's own API, and nothing else. This list is also what bounds the address the
# plugin may ask a person to visit: a sign-in page outside it is refused by the host.
[capabilities.net_http]
domains = ["api.real-debrid.com", "real-debrid.com", "www.real-debrid.com"]

[extension]
slug = "realdebrid_auth"
# One provider. Which plugin signs an account in is decided by this.
claims = ["realdebrid"]

[metadata]
description = "Signs a Real-Debrid account in with a device code, and keeps the token renewed."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.9.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 15000
max_response_bytes = 262144
