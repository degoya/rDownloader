plugin_type = "notifier"
id = "019d0000-0000-7000-8000-000000000105"
name = "Telegram"
version = "0.9.15"

# The only addresses this destination may reach. The token never passes through the plugin:
# it writes the reference-less secret marker and the host substitutes, on the way out, the one
# secret this invocation was granted.
[capabilities.net_http]
domains = ["api.telegram.org"]

[extension]
slug = "telegram_notifier"
# Empty: a destination is chosen by name when a notification target is created, not matched
# against anything.
claims = []

[metadata]
description = "Delivers notifications to a Telegram chat through a bot."

[limits]
memory_bytes = 33554432
fuel = 500000000
max_response_bytes = 262144
