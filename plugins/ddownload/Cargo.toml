[package]
name = "rd-plugin-ddownload"
version = "1.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
url.workspace = true
plugin-common = { path = "../common" }
plugin-guest = { path = "../guest" }
xfs-common = { path = "../xfs-common" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait.workspace = true
rd-plugin-api = { path = "../../crates/rd-plugin-api" }
rd-plugin-types = { path = "../../crates/rd-plugin-types" }

[lib]
crate-type = ["rlib"]

[dev-dependencies]
plugin-common = { path = "../common", features = ["test-support"] }
# The service's reading of a used-up account (`is_account_traffic_exhausted`), which a test
# holds the plugin's failure to. Tests only: the plugin itself links `rd-plugin-types` (RD-1190-08).
rd-core = { path = "../../crates/rd-core" }
rd-plugin-api = { path = "../../crates/rd-plugin-api", features = ["test-support"] }
tokio.workspace = true
xfs-common = { path = "../xfs-common", features = ["test-support"] }

[lints]
workspace = true
