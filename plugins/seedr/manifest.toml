manifest_version = 3
plugin_type = "resolver"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000180"
name = "Seedr"
version = "0.1.4"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="
# The canonical per-file API address the remote-job sibling emits, and the bare domain a person
# may paste instead. Never `*`: Seedr serves its own storage and unrestricts nobody else's
# links, so this is a hoster and not a multihoster.
match_domains = ["www.seedr.cc", "seedr.cc"]
# Where the bytes come from. Seedr's documented file endpoint *is* the download -- its own
# example follows it with `-L` -- so a transfer starts on the API host and may be redirected
# from there onto Seedr's storage.
download_domains = ["www.seedr.cc", "seedr.cc", "*.seedr.cc"]
# Seedr publishes no concurrency guidance, so this is the figure the other API-shaped providers
# in this tree settled on rather than a number read anywhere.
max_concurrent_downloads = 3

[capabilities]
# The account password, the same slot the remote-job sibling reads. It is read back here only
# inside the template `{{basic:seedr_password}}`, never as a value: the host pairs it with the
# account's e-mail address, encodes the two and sends the result towards `www.seedr.cc` and
# nowhere else. The transfer gets the same pair from the download engine, see `transfer_auth`.
secrets = ["seedr_password"]

[capabilities.net_http]
domains = ["www.seedr.cc"]

[metadata]
description = "Resolves files in a Seedr account through the official REST API."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "1.2.0"

# The provider row every Seedr plugin hangs off. Only a resolver manifest may carry one, which
# is why this plugin exists at all: without this row there is no Seedr account, no vault
# reference, and therefore no way for the remote job to reach anything.
[provider]
slug = "seedr"
kind = "hoster"
# Seedr's REST v1 states its own limit plainly: "only available to use with HTTP basic auth".
# There is no key to type and no token to obtain -- the integration page advertises OAuth2 and
# account-generated tokens, and links no documentation for either, still in 2026 -- so the
# credential is the account's own e-mail address and password. Six shipped plugins already
# carry an account password this way; what is different here is only that both halves travel
# on every request, which is what `{{basic:<reference>}}` exists for (RD-120-04).
credentials = "username_password"
# The e-mail address is the HTTP Basic user id. Required, because half a Basic credential is
# not a credential: a request built from a password alone reaches Seedr and comes back 401,
# which reads as an expired sign-in on an account that was never complete.
username_required = true
secret_reference = "seedr_password"
secret_domains = ["www.seedr.cc"]
# The file address `www.seedr.cc/rest/file/<id>` *is* the download and answers HTTP Basic and
# nothing else, and the bytes are fetched by the download engine rather than by this plugin. So
# the engine attaches `Authorization: Basic` itself, built from this account's e-mail address
# and password, over TLS and to `secret_domains` only -- checked against the address the bytes
# actually come from, so a redirect onto Seedr's storage or anywhere else does not inherit it
# (RD-120-38). No second authentication profile holding the same password is needed.
transfer_auth = "basic"
# Deliberately no `cookie_scope`. This is an API-shaped hoster with no `cookies` capability; a
# scope nothing can use would be a promise about where credentials go that nothing keeps.

[limits]
memory_bytes = 33554432
fuel = 1000000000
timeout_milliseconds = 15000
max_response_bytes = 2097152
