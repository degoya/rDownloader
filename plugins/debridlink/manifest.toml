manifest_version = 3
plugin_type = "resolver"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-00000000000a"
name = "Debrid-Link"
version = "0.7.4"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="
match_domains = ["*"]
download_domains = ["*"]
max_concurrent_downloads = 3

[capabilities]
secrets = ["debridlink_api_key"]

[capabilities.net_http]
domains = ["debrid-link.com", "*.debrid-link.com"]

[metadata]
description = "Resolves links of other hosters through a Debrid-Link account."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.7.0"

[provider]
slug = "debridlink"
kind = "multihoster"
credentials = "api_key"
username_required = false
secret_reference = "debridlink_api_key"
secret_domains = ["debrid-link.com"]
[limits]
memory_bytes = 67108864
fuel = 2000000000
timeout_milliseconds = 15000
max_response_bytes = 8388608
