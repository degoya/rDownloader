[package]
name = "xfs-common"
version = "1.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
plugin-common = { path = "../common" }
plugin-flexible = { path = "../flexible" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[features]
# The mock host and the shared cases the XFS plugins' suites call with their own parameters
# (`test_support`, RD-1120-10): a plugin turns this on in its `[dev-dependencies]` line, so no
# component carries it.
test-support = []

[lib]
crate-type = ["rlib"]

[lints]
workspace = true
