plugin_type = "resolver"
id = "019d0000-0000-7000-8000-000000000008"
name = "FileJoker"
# 0.3.0: free (account-less) downloads. The version must rise, or a running instance keeps
# the installed package (`sync_bundled` only installs newer ones) and never picks the free
# flow up. Pinned jobs are unaffected: the older version stays installed.
version = "0.7.20"
match_domains = ["filejoker.net", "www.filejoker.net"]
download_domains = ["filejoker.net", "*.filejoker.net"]
max_concurrent_downloads = 3
# Links without an account are served by the XFS free flow (page -> download1 -> captcha +
# countdown -> download2 -> direct link).
requires_account = false

[capabilities]
cookies = true
captcha = true

[capabilities.net_http]
domains = ["filejoker.net", "*.filejoker.net"]

[metadata]
description = "Resolves FileJoker links with account cookies."

[provider]
slug = "filejoker"
kind = "hoster"
credentials = "cookies"
username_required = false
cookie_scope = "https://filejoker.net/"
