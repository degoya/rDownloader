plugin_type = "notifier"
id = "019d0000-0000-7000-8000-000000000183"
name = "Jellyfin"
version = "0.2.2"

# The media server is the person's own, so the manifest names no host: `*` is "the server the
# destination names" (RD-130-15), and the host narrows every delivery to the host of the address
# the target was given -- a destination that is not an address reaches nothing and is refused
# when the target is saved. The token never passes through the plugin: it writes the
# reference-less secret marker and the host substitutes, on the way out, the one secret this
# invocation was granted.
[capabilities.net_http]
domains = ["*"]

[extension]
slug = "jellyfin_notifier"
# Empty: a destination is chosen by name when a notification target is created, not matched
# against anything.
claims = []

# Free text (RD-1250-01): one `rDownloader path=server path` per line; the longest that holds the
# finished package's folder decides, and the server is told that folder is new. A folder no line
# holds, or no mapping at all, refreshes every library as before.
[[extension.settings]]
name = "path_mapping"
multiline = true

[metadata]
description = "Refreshes the Jellyfin libraries when a package finishes."

[limits]
memory_bytes = 33554432
fuel = 500000000
max_response_bytes = 262144
