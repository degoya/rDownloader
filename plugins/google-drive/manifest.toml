plugin_type = "resolver"
id = "019d0000-0000-7000-8000-000000000110"
name = "Google Drive"
version = "0.1.15"
# The addresses a person pastes, plus the canonical per-file API address the sibling crawler
# emits. Never `*`: this is a hoster for its own drive, not a multihoster.
match_domains = [
  "drive.google.com",
  "docs.google.com",
  "drive.usercontent.google.com",
  "www.googleapis.com",
]
# Where the bytes come from. `drive.usercontent.google.com` is where a public share redirects.
download_domains = ["www.googleapis.com", "drive.usercontent.google.com"]
max_concurrent_downloads = 3

[capabilities]
secrets = ["google_drive_access_token"]

[capabilities.net_http]
domains = ["www.googleapis.com"]

[metadata]
description = "Resolves Google Drive files, shared links and Workspace exports through the official Drive API."

# The provider row every Google Drive plugin hangs off. Only a resolver manifest may carry
# one, which is why this plugin exists even though the folder walk and the sign-in are its
# siblings: without this row there is no account, no vault reference and therefore no way for
# either of them to reach anything.
[provider]
slug = "google_drive"
kind = "hoster"
credentials = "oauth"
# The account's username field holds this installation's own Google OAuth client id
# (RD-106-04). It is not a credential — Google publishes it in the address the person is sent
# to — so it is stored in the clear and the host expands it into `{{client_id}}`. Required,
# because a sign-in without one cannot start: this project ships no client of its own, and one
# compiled in here would put every installation on a single shared Google quota.
username_required = true
secret_reference = "google_drive_access_token"
secret_domains = ["www.googleapis.com"]

[limits]
memory_bytes = 33554432
fuel = 1000000000
max_response_bytes = 2097152
