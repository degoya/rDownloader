[package]
name = "rd-plugin-offcloud"
version = "1.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
offcloud-common = { path = "../offcloud-common" }
plugin-common = { path = "../common" }
plugin-guest = { path = "../guest" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait.workspace = true
rd-plugin-api = { path = "../../crates/rd-plugin-api" }
rd-plugin-types = { path = "../../crates/rd-plugin-types" }

[lib]
crate-type = ["rlib"]

[dev-dependencies]
plugin-common = { path = "../common", features = ["test-support"] }
rd-plugin-api = { path = "../../crates/rd-plugin-api", features = ["test-support"] }
tokio.workspace = true

[lints]
workspace = true
