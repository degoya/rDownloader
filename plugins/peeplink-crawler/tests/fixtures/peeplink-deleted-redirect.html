$(document).ready(function(){
$('.bold, .underline, .emphasize').click(function() {
var button_id = attribs = $(this).attr("alt");
//button_id = button_id.replace(/\[.*\]/, '');
if (/\[.*\]/.test(attribs)) { attribs = attribs.replace(/.*\[(.*)\]/, ' $1'); } else attribs = '';
var start = '['+button_id+attribs+']';
var end = '[/'+button_id+']';
insert(start, end);
return false;});});


function insert(start, end) {
element = document.getElementById('text');
if (document.selection) {
element.focus();
sel = document.selection.createRange();
sel.text = start + sel.text + end;
} else if (element.selectionStart || element.selectionStart == '0') {
element.focus();
var startPos = element.selectionStart;
var endPos = element.selectionEnd;
element.value = element.value.substring(0, startPos) + start + element.value.substring(startPos, endPos) + end + element.value.substring(endPos, element.value.length);
} else {
element.value += start + end;
}}


K = ''; 
function ge(g){return document.getElementById(g)}
function timerMouseHack(){var timer = setInterval(mouseHak,333);}
function mouseHak(){
  var val = $('#text').val();
  if (val != K){
    K = val;
  	if(K != 'feed me') autoresizeT(ge('text'),150,15);
  }
}

FLAG = 0;
function autoresizeT(obj,minH,step)
{
	maxH = ($("#body").height() - 420);
  if (FLAG == 2)
  {

  	if (obj.scrollHeight <= maxH)
  	{
  	  FLAG = 1;
    }
  	else return false;
  }


  function slave(obj,minH)
  {

    obj.style.height = minH + 'px';
    obj.style.overflow = 'hidden';
    obj.scrollHeight;

    return obj.scrollHeight;
  }

  if (FLAG == 1)
  {
  	var sH = slave(obj,minH);
  	if (sH > (maxH + step))
  	{
      obj.style.height = maxH + 'px';
      obj.style.overflow = 'auto';
      obj.focus();
      FLAG = 2;
  	  return false;
  	}
  	else
  	{
      obj.style.height = maxH + 'px';
      FLAG = 0;
  	}
  }

  if (FLAG == 0)
  {
  	var sH = slave(obj,minH);
  	if (sH > minH)
  	{

      if ((sH  + step) < maxH)
      {
        obj.style.height = obj.scrollHeight + step + 'px';
        obj.focus();
      }
      else
      {
        obj.style.height = maxH + 'px';
        obj.style.overflow = 'auto';
        obj.focus();
        FLAG = 1;
      }
  	}
  }
}
function x(){

}
