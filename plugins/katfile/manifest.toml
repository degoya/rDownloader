manifest_version = 3
plugin_type = "resolver"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000005"
name = "KatFile"
# 0.3.0: free (account-less) downloads. The version must rise, or a running instance keeps
# the installed 0.2.0 package (`sync_bundled` only installs newer ones) and never picks the
# free flow up. Pinned jobs are unaffected: installing 0.3.0 leaves 0.2.0 in place.
version = "0.9.6"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="
# Seven domains per JD's KatfileCom.getPluginDomains() (rev 53112): katfile.biz is the current
# main domain (index 0); the other six are aliases the live site has used since 2025 and still
# accepts. See plugins/katfile/src/native/api.rs's module doc.
match_domains = [
  "katfile.biz", "www.katfile.biz",
  "katfile.space", "www.katfile.space",
  "katfile.ws", "www.katfile.ws",
  "katfile.vip", "www.katfile.vip",
  "katfile.online", "www.katfile.online",
  "katfile.cloud", "www.katfile.cloud",
  "katfile.com", "www.katfile.com",
]
download_domains = [
  "katfile.biz", "*.katfile.biz",
  "katfile.space", "*.katfile.space",
  "katfile.ws", "*.katfile.ws",
  "katfile.vip", "*.katfile.vip",
  "katfile.online", "*.katfile.online",
  "katfile.cloud", "*.katfile.cloud",
  "katfile.com", "*.katfile.com",
]
max_concurrent_downloads = 5
# Links without an account are served by the XFS free flow (page -> download1 -> captcha +
# countdown -> download2 -> direct link).
requires_account = false

[capabilities]
cookies = true
captcha = true
secrets = ["katfile_api_key"]

[capabilities.net_http]
domains = [
  "katfile.biz", "*.katfile.biz",
  "katfile.space", "*.katfile.space",
  "katfile.ws", "*.katfile.ws",
  "katfile.vip", "*.katfile.vip",
  "katfile.online", "*.katfile.online",
  "katfile.cloud", "*.katfile.cloud",
  "katfile.com", "*.katfile.com",
]

[metadata]
description = "Resolves KatFile links across its mirror domains."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.7.0"

[provider]
slug = "katfile"
kind = "hoster"
credentials = "api_key_or_cookies"
username_required = false
secret_reference = "katfile_api_key"
secret_domains = ["katfile.biz"]
cookie_scope = "https://katfile.biz/"
host_aliases = [
  ["katfile.space", "katfile.biz"],
  ["katfile.ws", "katfile.biz"],
  ["katfile.vip", "katfile.biz"],
  ["katfile.online", "katfile.biz"],
  ["katfile.cloud", "katfile.biz"],
  ["katfile.com", "katfile.biz"],
]
[limits]
memory_bytes = 67108864
fuel = 2000000000
timeout_milliseconds = 15000
max_response_bytes = 8388608
# A free download waits out the hoster's countdown and one captcha round trip; this budget is
# spent on waiting only and does not extend the compute timeout above.
wait_budget_milliseconds = 600000
