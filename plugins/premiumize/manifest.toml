manifest_version = 3
plugin_type = "resolver"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-000000000002"
name = "Premiumize.me"
version = "0.7.6"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="
match_domains = ["*"]
download_domains = ["*"]
max_concurrent_downloads = 3

[capabilities]
secrets = ["premiumize_api_key"]

[capabilities.net_http]
domains = ["premiumize.me", "www.premiumize.me", "*.premiumize.me"]

[metadata]
description = "Resolves links of other hosters through a Premiumize.me account."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.7.0"

[provider]
slug = "premiumize"
kind = "multihoster"
credentials = "api_key"
username_required = false
secret_reference = "premiumize_api_key"
secret_domains = ["www.premiumize.me"]
# Deliberately no `cookie_scope`. The built-in row this replaces declared one, but this plugin
# has no `cookies` capability and never touches the jar — it is an API-key multihoster. The
# manifest check refuses a grant the runtime does not enforce, and it is right to: a scope that
# nothing can use is a promise about where credentials go that nobody keeps.
[limits]
memory_bytes = 67108864
fuel = 2000000000
timeout_milliseconds = 15000
max_response_bytes = 8388608
