manifest_version = 3
plugin_type = "stream-transform"
api_version = "0.9.0"
id = "019d0000-0000-7000-8000-0000000000e3"
name = "Example Stream Transform"
version = "0.1.3"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

# The reference plugin ships with a host nobody can reach. It exists to be driven by the
# contract tests in `crates/rd-plugin-ext/tests/stream_transform_contract.rs`, and a usable
# domain here would mean shipping a plugin that fetches from somebody's provider.
[capabilities.net_http]
domains = ["transform.example.invalid"]

[extension]
slug = "example_stream_transform"
# One provider. No resolver defines `example`, so nothing is ever routed here.
claims = ["example"]

[metadata]
description = "Reference plugin demonstrating the stream-transform contract."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "1.1.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 15000
max_response_bytes = 1048576
