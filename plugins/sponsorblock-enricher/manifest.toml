manifest_version = 3
plugin_type = "enricher"
api_version = "0.9.0"
# Was `…109` until 0.9.8, which `rename-postprocess` also claimed. Since the loader keeps
# only the highest version per id, and that was the other plugin, this one had never been
# loaded. It moved rather than the other because nothing can be pinned to an identity that
# never loaded (RD-098-03).
id = "019d0000-0000-7000-8000-00000000010e"
name = "SponsorBlock"
version = "0.9.3"
key_id = "rdownloader-release-v1"
public_key = "5C0fhOCoSaW9Ucdh1x3lUw05IX8YfNzJcgXkgnwjzeY="

# The one address this plugin reaches. It sends a video id and nothing else — no account, no
# cookies, nothing that identifies the person asking.
[capabilities.net_http]
domains = ["sponsor.ajay.app"]

[extension]
slug = "sponsorblock_enricher"
# Only YouTube links: SponsorBlock has segments for nothing else, and asking about a link it
# cannot know would tell that service about addresses for no possible answer.
claims = ["youtube.com", "youtu.be"]

[metadata]
description = "Reports how much of a YouTube video is sponsor or intro, before it is downloaded."
author = "rDownloader project"
homepage = "https://rdownloader.net"
license = "MIT"
min_app_version = "0.9.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 10000
max_response_bytes = 262144
