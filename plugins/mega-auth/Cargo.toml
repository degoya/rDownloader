[package]
name = "rd-plugin-mega-auth"
version = "1.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The RSA private operation, and nothing else: every other stage of the sign-in happens on
# the host, over a credential this plugin never sees (RD-120-20). What is decrypted here is
# the session identifier MEGA encrypted to the account's own public key -- not a credential,
# and already in the plugin's hands as ciphertext.
num-bigint.workspace = true
# MEGA's base64 and the JSON reader of its answers (RD-191-07): the same ones the resolver and
# the crawler use, rather than a hand-rolled copy of each.
mega-common = { path = "../mega-common" }
plugin-guest-auth = { path = "../guest-auth" }
serde_json.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true
