[package]
name = "{{PLUGIN_SLUG}}"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# See the resolver template: a guest needs only the contract, which ships in `wit/`.
wit-bindgen = "0.62"

[lib]
# `rlib` alongside `cdylib` so `cargo test` builds the scaffold for the host target and runs
# the unit tests in `src/list.rs` without a WebAssembly toolchain.
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "{{PLUGIN_SLUG}}:intake-mirrors"

[package.metadata.component.target]
path = "wit"
# The intake world plus `mirror-sets`. A parser that states no sources builds against
# `intake-plugin` instead and is asked nothing more.
world = "intake-mirrors-plugin"
