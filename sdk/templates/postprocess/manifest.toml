manifest_version = 3
plugin_type = "postprocess"
api_version = "0.9.0"
id = "{{PLUGIN_ID}}"
name = "{{PLUGIN_NAME}}"
version = "0.1.0"
# `plugin new` generated this key pair for you; the private half is `plugin-signing.key`.
# Keep it out of version control, and use your own key id.
key_id = "{{PLUGIN_SLUG}}-release-v1"
public_key = "REPLACE_WITH_YOUR_BASE64_ED25519_PUBLIC_KEY"

# A step that only reads the package needs nothing granted. Reading its files is not a
# capability but part of what this type is, and the host hands over a handle, never a path.
[capabilities]

[extension]
slug = "{{PLUGIN_SLUG}}"
# Left empty: a step is switched on per category rather than matched against a link.
claims = []

[metadata]
description = "One more step after a {{PLUGIN_NAME}} package has been downloaded."
author = "Your name"
license = "MIT"
min_app_version = "0.9.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 600000
max_response_bytes = 1048576
