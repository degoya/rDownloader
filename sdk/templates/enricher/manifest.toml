manifest_version = 3
plugin_type = "enricher"
api_version = "0.10.0"
id = "{{PLUGIN_ID}}"
name = "{{PLUGIN_NAME}}"
version = "0.1.0"
# `plugin new` generated this key pair for you; the private half is `plugin-signing.key`.
# Keep it out of version control, and use your own key id.
key_id = "{{PLUGIN_SLUG}}-release-v1"
public_key = "REPLACE_WITH_YOUR_BASE64_ED25519_PUBLIC_KEY"

# Nothing granted: this enricher reads the file name it is handed. One that looks something up
# adds `[capabilities.net_http]` with exactly the hosts it calls — the host refuses the rest, and
# the plugin manager shows the list to the person deciding whether to install it.
[capabilities]

[extension]
slug = "{{PLUGIN_SLUG}}"
# Domain patterns this enricher is offered for. Empty means every link of its type.
claims = []

[metadata]
description = "Adds {{PLUGIN_NAME}} details to a link before it is downloaded."
author = "Your name"
license = "MIT"
min_app_version = "0.9.0"

[limits]
memory_bytes = 33554432
fuel = 500000000
timeout_milliseconds = 10000
max_response_bytes = 1048576
