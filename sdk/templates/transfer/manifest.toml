manifest_version = 3
plugin_type = "transfer"
api_version = "0.9.0"
id = "{{PLUGIN_ID}}"
name = "{{PLUGIN_NAME}}"
version = "0.1.0"
# `plugin new` generated this key pair for you; the private half is `plugin-signing.key`.
# Keep it out of version control, and use your own key id.
key_id = "{{PLUGIN_SLUG}}-release-v1"
public_key = "REPLACE_WITH_YOUR_BASE64_ED25519_PUBLIC_KEY"
max_concurrent_downloads = 2

[capabilities]

# The hosts and ports this backend may dial. There is no wildcard port on purpose.
[capabilities.net_stream]
hosts = ["files.example.net", "*.example.net"]
ports = [21, 990]

[transfer]
slug = "{{PLUGIN_SLUG}}"
schemes = ["{{PLUGIN_SLUG}}"]

[metadata]
description = "Transfers files over the {{PLUGIN_NAME}} protocol."
author = "Your name"
license = "MIT"
min_app_version = "0.7.0"

[limits]
memory_bytes = 67108864
fuel = 2000000000
timeout_milliseconds = 15000
max_response_bytes = 8388608
