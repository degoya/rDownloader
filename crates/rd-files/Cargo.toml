[package]
name = "rd-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `md-5` is imported as `md5` (src/checksum.rs), which cargo-machete does not map back.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[dependencies]
anyhow.workspace = true
crc32fast.workspace = true
dunce.workspace = true
fs4.workspace = true
hex.workspace = true
md-5.workspace = true
rd-core = { path = "../rd-core" }
regex.workspace = true
serde.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true

# The data directory's access list and the account's SID, read and set in this process
# (RD-1400-07, `src/private_dir.rs`).
[target.'cfg(windows)'.dependencies]
rd-win32 = { path = "../rd-win32" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
