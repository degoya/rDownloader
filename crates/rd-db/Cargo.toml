[package]
name = "rd-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Forwards rd-core's deterministic crash points; see crates/rd-core/src/failpoint.rs.
failpoints = ["rd-core/failpoints"]
# Hooks only tests call (RD-1110-06); switched on by dev-dependencies, never by the service.
test-support = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
rd-automation = { path = "../rd-automation" }
rd-core = { path = "../rd-core" }
rd-limits = { path = "../rd-limits" }
rd-notify = { path = "../rd-notify" }
rd-files = { path = "../rd-files" }
rd-collector = { path = "../rd-collector" }
rd-provider-registry = { path = "../rd-provider-registry" }
rd-secrets = { path = "../rd-secrets" }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Its own integration tests reach the `test-support` hooks this way.
rd-db = { path = ".", features = ["test-support"] }
# The key canary in `tests/transform_key.rs` searches for the key in the spelling the
# vault would have written it in, which is base64.
base64.workspace = true
tempfile.workspace = true
