<!DOCTYPE html>
<html class="ng-csp" data-placeholder-focus="false" lang="en" data-locale="en">
	<head data-requesttoken="Rk9PYkFyMTIzNDU2Nzg5MA==">
		<meta charset="utf-8">
		<title>Login - Nextcloud</title>
		<link rel="stylesheet" href="/core/css/guest.css">
	</head>
	<body id="body-login">
		<form method="post" name="login" action="/login">
			<fieldset>
				<label for="user">Account name or email</label>
				<input type="text" name="user" id="user" autocomplete="username" required>
				<label for="password">Password</label>
				<input type="password" name="password" id="password" autocomplete="current-password" required>
				<input type="submit" id="submit-form" value="Log in">
			</fieldset>
		</form>
	</body>
</html>
