[package]
name = "rd-plugin-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Hooks only tests call (RD-1110-06); switched on by dev-dependencies, never by the service.
test-support = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["fs"] }
rd-core = { path = "../rd-core" }
async-trait.workspace = true
rd-extract = { path = "../rd-extract" }
rd-plugin-api = { path = "../rd-plugin-api" }
rd-plugin-host = { path = "../rd-plugin-host" }
rd-siterules = { path = "../rd-siterules" }
# The device value a rule run sees, derived per rule (RD-1190-22).
sha2.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Its own integration tests reach the `test-support` hooks this way.
rd-plugin-ext = { path = ".", features = ["test-support"] }
base64.workspace = true
md-5.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
rd-provider-registry = { path = "../rd-provider-registry" }
# The contract tests load the built components (`artifact`, RD-191-06 PLUG-15).
rd-plugin-host = { path = "../rd-plugin-host", features = ["test-support"] }
# The end-to-end proof that a vaulted link fragment reaches the resolver (RD-110-38).
rd-secrets = { path = "../rd-secrets" }
# The MEGA contract test recomputes the key it asserts was never sent, rather than pasting it.
mega-common = { path = "../../plugins/mega-common" }
# The MEGA account contract wraps an invented master key's node keys, the one thing no plugin
# does itself (RD-120-30). Already in the graph through `rd-plugin-host`.
aes.workspace = true
# The seam RD-120-11 found broken: what the real component answers has to be something
# `StreamTransform::new` will accept. Already in the graph through `rd-plugin-host`.
rd-http = { path = "../rd-http" }
# The paced upload test builds a registry with an upload limit (RD-150-15).
rd-limits = { path = "../rd-limits" }
toml.workspace = true

[lints]
workspace = true
