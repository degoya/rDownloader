[package]
name = "rd-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rdownloader-capture"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
directories.workspace = true
global-hotkey.workspace = true
keyring.workspace = true
notify-rust.workspace = true
rd-cnl = { path = "../rd-cnl" }
rd-collector = { path = "../rd-collector" }
rd-autostart = { path = "../rd-autostart" }
rd-core = { path = "../rd-core" }
rd-files = { path = "../rd-files" }
# The agent's own update (RD-1210-03): the service's signed manifest, check and install.
rd-update = { path = "../rd-update" }
# The link page's secret and its comparison (RD-1390-02).
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# Tray/menu-bar integration is Windows- and macOS-only; Linux stays headless and must not link
# any window toolkit, no GTK and no WebKitGTK (see src/tray.rs and the README capture section).
#
# Where that line runs exactly: `arboard` above is ungated, and it pulls `x11rb` and
# `wl-clipboard-rs` behind it, so the headless Linux agent does link X11 and Wayland *client*
# libraries. That is deliberate. A clipboard client is not a window toolkit: it needs no GTK,
# and where no display server is reachable it returns an error instead of taking the agent
# down. Clipboard watching is wanted on Linux, so this is the right line — what must not cross
# it is a windowing or rendering stack. `src/platform_gate/` holds it by reading this file.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
open.workspace = true
png.workspace = true
tao.workspace = true
tray-icon.workspace = true

# The clipboard's concealment marks (RD-1200-03, `src/clipboard/marks/`), per platform: the
# crates `arboard` already links there, asked for what it does not read.
[target.'cfg(windows)'.dependencies]
clipboard-win.workspace = true
# The display language the intake toast speaks (RD-1270-05, `src/locale.rs`).
winreg.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
# The language the intake toast speaks when launchd sets no POSIX variable (RD-1270-19).
objc2-foundation.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wl-clipboard-rs.workspace = true
x11rb.workspace = true

[dev-dependencies]
rd-testkit = { path = "../rd-testkit", default-features = false }
# Read by src/platform_gate/, which judges this manifest as TOML rather than as text.
toml.workspace = true

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
