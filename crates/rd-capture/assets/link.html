<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>rDownloader Capture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #d5dae1;
    --accent: #2563eb; --accent-text: #ffffff; --bad: #b42318; --good: #157f3c; --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e7eaee; --muted: #9aa4b1; --line: #2f3741;
      --accent: #5b8def; --accent-text: #0b0e12; --bad: #f2867c; --good: #6fd08f; --warn: #f0b75a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .product { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 9px 11px; font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .insecure { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .insecure label { display: flex; gap: 8px; align-items: flex-start; margin: 0; font-weight: 600; color: var(--warn); }
  .insecure input { margin-top: 4px; }
  button {
    margin-top: 20px; width: 100%; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--accent-text); background: var(--accent); border: 0; border-radius: 8px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .message { margin: 14px 0 0; min-height: 1.5em; }
  .message.bad { color: var(--bad); }
  .message.good { color: var(--good); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="product">rDownloader Capture</p>
  <form id="form" novalidate>
    <label for="service" id="service-label"></label>
    <input type="text" id="service" autocomplete="off" spellcheck="false" inputmode="url">
    <p class="hint" id="service-example"></p>
    <div class="insecure" id="insecure-box" hidden>
      <label><input type="checkbox" id="insecure"><span id="insecure-label"></span></label>
      <p class="hint" id="insecure-why"></p>
    </div>
    <label for="token" id="token-label"></label>
    <input type="password" id="token" autocomplete="off" spellcheck="false">
    <p class="hint" id="token-hint"></p>
    <button type="submit" id="connect"></button>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
"use strict";
const DATA = __DATA__;
const t = (key) => DATA.texts[key] || key;
const $ = (id) => document.getElementById(id);
const fields = {
  title: "link_title", "service-label": "link_service", "service-example": "link_service_example",
  "insecure-label": "link_insecure", "insecure-why": "link_insecure_why", "token-label": "link_token",
  "token-hint": "link_token_hint", connect: "link_connect"
};
for (const [id, key] of Object.entries(fields)) $(id).textContent = t(key);
document.title = t("link_title") + " · rDownloader Capture";

const service = $("service"), token = $("token"), insecure = $("insecure");
const box = $("insecure-box"), connect = $("connect"), message = $("message");
service.placeholder = "http://192.168.1.10:8710";
service.value = DATA.service || "";

// Plain http to another machine: the case the confirmation is for. The same rule as the agent's
// (`config::is_loopback`): an IPv4 literal in 127.0.0.0/8, `[::1]` or `localhost`, nothing that
// merely starts with "127." such as 127.0.0.1.nip.io.
function isLoopback(host) {
  return /^127(\.\d{1,3}){3}$/.test(host) || host === "[::1]" || host === "localhost" || host === "localhost.";
}
function needsConfirmation(text) {
  let url;
  try { url = new URL(text.trim()); } catch (_) { return false; }
  if (url.protocol !== "http:") return false;
  return !isLoopback(url.hostname.toLowerCase());
}
const same = (a, b) => a.trim().replace(/\/+$/, "") === b.trim().replace(/\/+$/, "");
let shownFor = null;
function refresh() {
  const needed = needsConfirmation(service.value);
  box.hidden = !needed;
  if (needed && shownFor === null) {
    // Remembered for exactly the address that was confirmed before; a new one is asked again.
    insecure.checked = DATA.confirmed && same(service.value, DATA.service || "");
  }
  if (needed && shownFor !== null && !same(service.value, shownFor)) insecure.checked = false;
  shownFor = needed ? service.value : null;
  connect.disabled = needed && !insecure.checked;
}
service.addEventListener("input", refresh);
insecure.addEventListener("change", refresh);
refresh();

function say(text, kind) {
  message.textContent = text;
  message.className = "message" + (kind ? " " + kind : "");
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  connect.disabled = true;
  say("", "");
  const body = {
    service: service.value,
    token: token.value,
    allow_insecure: !box.hidden && insecure.checked
  };
  try {
    const response = await fetch(location.pathname, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      cache: "no-store",
      credentials: "omit"
    });
    const answer = await response.json().catch(() => ({}));
    if (response.ok) {
      token.value = "";
      const done = answer.insecure ? t("link_done_insecure") : t("link_done");
      say(done.replace("{service}", answer.service || service.value) + " " + t("link_close"), "good");
    } else {
      say(DATA.texts[answer.code] || t("link_failed"), "bad");
    }
  } catch (_) {
    say(t("link_failed"), "bad");
  }
  refresh();
});
</script>
</body>
</html>
