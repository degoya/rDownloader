[package]
name = "rd-object-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Azure Blob Storage and Google Cloud Storage (RD-150-05). On by default; a build without them
# still accepts `az://` and `gs://` links and refuses them with
# `object_storage.provider_unsupported`. S3 is always there.
default = ["azure", "gcs"]
azure = ["object_store/azure"]
gcs = ["object_store/gcp"]
# The crash point of the multipart upload (`object_storage.after_part_upload`), for its case in
# `src/tests.rs`; see `crates/rd-core/recovery-matrix.md`.
failpoints = ["rd-core/failpoints"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# The shape checks of an Azure account key and a Google service account key (`credentials.rs`).
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
object_store.workspace = true
rd-core = { path = "../rd-core" }
rd-db = { path = "../rd-db" }
# For the upload step's contract, `rd_extract::ObjectUploader`, which this crate implements.
rd-extract = { path = "../rd-extract" }
rd-files = { path = "../rd-files" }
# The proxy and custom CA every other transport uses (`rd_http::SharedNetworkDefaults`).
rd-http = { path = "../rd-http" }
rd-limits = { path = "../rd-limits" }
# The rule an address the person entered keeps to, which a profile's endpoint is held to
# (`rd_plugin_host::entered_address_policy`, RD-1190-18).
rd-plugin-host = { path = "../rd-plugin-host" }
rd-scheduler = { path = "../rd-scheduler" }
rd-secrets = { path = "../rd-secrets" }
rd-transfer-file = { path = "../rd-transfer-file" }
# The client `object_store` sends through, built here with no redirect policy (RD-1200-06,
# `connect/transport.rs`): the workspace's reqwest, the one `object_store` links.
reqwest.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
axum.workspace = true
# The TLS endpoint of `tests/s3_tls.rs`: a CA of its own and a rustls listener.
rcgen.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
