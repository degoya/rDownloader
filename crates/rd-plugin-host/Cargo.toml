[package]
name = "rd-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Deterministic crash points for the RD-140-04 restart matrix; see crates/rd-core/recovery-matrix.md.
failpoints = ["rd-core/failpoints"]
# The component loader the contract tests use (`artifact`), which panics on a missing or stale
# build and has no business in the service (RD-191-06, PLUG-15).
test-support = ["rd-provider-registry/test-support"]

[dependencies]
aes.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
rand.workspace = true
rd-core = { path = "../rd-core" }
rd-db = { path = "../rd-db" }
rd-http = { path = "../rd-http" }
rd-files = { path = "../rd-files" }
rd-limits = { path = "../rd-limits" }
rd-plugin-api = { path = "../rd-plugin-api" }
rd-provider-registry = { path = "../rd-provider-registry" }
rd-secrets = { path = "../rd-secrets" }
rd-sign = { path = "../rd-sign" }
rd-siterules = { path = "../rd-siterules" }
reqwest.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
wasmparser.workspace = true
wasmtime.workspace = true
zeroize.workspace = true
zip.workspace = true

[dev-dependencies]
# This crate's own integration tests load components too; a dev-dependency on itself is how
# they get `test-support` without the service getting it.
rd-plugin-host = { path = ".", features = ["test-support"] }
rcgen.workspace = true
tempfile.workspace = true
# The parity contracts run a plugin's host-side build -- the one its own unit tests run on --
# beside its component, on the same script. Tests only: nothing is compiled into the service
# (RD-150-18).
rd-plugin-hitfile = { path = "../../plugins/hitfile" }
rd-plugin-krakenfiles = { path = "../../plugins/krakenfiles" }
rd-plugin-mediafire = { path = "../../plugins/mediafire" }
rd-plugin-turbobit = { path = "../../plugins/turbobit" }

[lints]
workspace = true
