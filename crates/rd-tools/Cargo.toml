[package]
name = "rd-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Hooks only tests call (RD-1110-06); switched on by dev-dependencies, never by the service.
test-support = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
lzma-rust2.workspace = true
rd-core = { path = "../rd-core" }
rd-db = { path = "../rd-db" }
rd-files = { path = "../rd-files" }
rd-sign = { path = "../rd-sign" }
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
# Its own integration tests reach the `test-support` hooks this way.
rd-tools = { path = ".", features = ["test-support"] }
axum.workspace = true
# Encoder only for the fixtures: the tests build their own tar.xz rather than committing one.
lzma-rust2 = { workspace = true, features = ["encoder"] }
tempfile.workspace = true

[lints]
workspace = true
