[package]
name = "rd-plugin-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Deterministic crash points for the RD-140-04 restart matrix; see crates/rd-core/recovery-matrix.md.
failpoints = ["rd-core/failpoints"]
# Hooks only tests call (RD-1110-06); switched on by dev-dependencies, never by the service.
test-support = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
rd-core = { path = "../rd-core" }
rd-db = { path = "../rd-db" }
rd-files = { path = "../rd-files" }
rd-http = { path = "../rd-http" }
rd-plugin-host = { path = "../rd-plugin-host" }
rd-scheduler = { path = "../rd-scheduler" }
rustls.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Its own integration tests reach the `test-support` hooks this way.
rd-plugin-transfer = { path = ".", features = ["test-support"] }
rd-limits = { path = "../rd-limits" }
# The contract tests load the built example backend (`artifact`, RD-191-06 PLUG-15).
rd-plugin-host = { path = "../rd-plugin-host", features = ["test-support"] }
tempfile.workspace = true
toml.workspace = true
