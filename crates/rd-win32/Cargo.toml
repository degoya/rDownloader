[package]
name = "rd-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The one crate allowed `unsafe` (owner, 2026-11-01, RD-1400-07): the Windows calls the service
# and the capture agent make in their own process instead of through a PowerShell child. Empty
# on every other platform, so a dependant names it under `cfg(windows)` and needs no stub.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
