[package]
name = "rd-usenet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Forwards rd-core's deterministic crash points; see crates/rd-core/src/failpoint.rs.
failpoints = ["rd-core/failpoints"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
crc32fast.workspace = true
dunce.workspace = true
futures-util.workspace = true
quick-xml.workspace = true
rd-collector = { path = "../rd-collector" }
rd-core = { path = "../rd-core" }
rd-db = { path = "../rd-db" }
rd-files = { path = "../rd-files" }
# For `tls_client_config`: the trust decision for a news server is the same decision HTTP and
# FTPS make, and it is made in exactly one place (rd-http/src/tls.rs).
rd-http = { path = "../rd-http" }
rd-scheduler = { path = "../rd-scheduler" }
rd-secrets = { path = "../rd-secrets" }
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
rd-extract = { path = "../rd-extract" }
rd-limits = { path = "../rd-limits" }
tempfile.workspace = true
zip.workspace = true
