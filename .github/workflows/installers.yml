name: Installers

# RD-180-05: the installers as a user runs them, built from this tree the way release.yml builds
# them — scripts/package-deb-rpm.sh and scripts/package-msi.sh over a stage in the release layout
# (debug binaries of this tree, the signed plugins of the latest release's `plugins-vX.Y.Z`).
# Each is installed silently, started until /api/v1/health answers, given marker files in its
# data folder, installed again over itself (the upgrade path), started again, and removed; the
# data folder must still be there with the database and the markers.
#
#   deb on Ubuntu 24.04: apt install, the packaged systemd user unit under a lingering user manager
#   rpm in a Fedora container: dnf install, the service run as a user
#   deb and rpm alike: the menu entry installed (the deb's checked by desktop-file-validate) and removed
#   both for x86_64 on ubuntu-24.04 and for aarch64 on ubuntu-24.04-arm, each natively (RD-190-12)
#   MSI on Windows Server 2025: msiexec /qn per user, AUTOSTART=1, a second build as the upgrade,
#     a German build installed and removed (RD-1120-20)
#   the capture agent's MSI (RD-1390-04): AUTOSTART=1 and without, the switches, the uninstall, an
#     upgrade that keeps a removed autostart removed, the full MSI refused by it and replacing it
#   macOS: `rdownloader-capture scheme install|remove` against Launch Services, the helper app
#     built as release.yml builds it
#
# Not here, because a runner cannot show it: the MSI's dialogs, a Start menu click, the capture
# agent under a graphical session, a link opened in a browser on a Mac (the live checklist in
# docs/roadmap/jobs/archive/180-05-linux-arm64-und-installer.md).
#
#   gh workflow run installers.yml --ref <branch>
#
# The release candidate dispatches it before the tag, beside ci.yml, and a red run holds the tag
# (owner, 2026-10-06, replacing "no tag runs" of 2026-10-04; the `public-ci` step,
# scripts/lib/release-steps-publish.sh).
on:
  push:
    # Branches only, never a tag (owner, 2026-10-04): path filters do not apply to tags, and a
    # `push` that names `branches` but no `tags` starts for no tag at all. The candidate was
    # checked before the tag; the tag adds nothing to check (scripts/tests/release-assets.sh).
    branches: ["**"]
    paths:
      - .github/workflows/installers.yml
      - packaging/linux/**
      - packaging/systemd/**
      - packaging/msi/**
      - resources/macos/**
      - scripts/package-deb-rpm.sh
      - scripts/package-msi.sh
      - scripts/release-assets.sh
      - scripts/lib/archive-layout.sh
      - scripts/lib/version-file.sh
      - scripts/windows/**
      - crates/rd-autostart/**
      - crates/rd-capture/src/os_integration.rs
      - crates/rd-capture/src/os_integration_windows.rs
      - crates/rd-capture/src/desktop_shortcut.rs
      - crates/rd-capture/src/hand_over.rs
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # RUSTUP_TOOLCHAIN: set by .github/actions/setup-rust for every step after it (RD-191-09).
  # Nothing else CARGO*/RUST*: Swatinem/rust-cache keys a cache by those variables, and with
  # ci.yml's these jobs restore its `rust-tests` (RD-1120-07).
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            nfpm: x86_64
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          - os: ubuntu-24.04-arm
            arch: aarch64
            nfpm: arm64
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-embed compiles web/dist into the binary.
      - uses: ./.github/actions/setup-web
      - name: Build the web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      # ci.yml's `rust-tests` cache, read only (RD-1120-07): the dependencies of a debug build
      # with the same linkers. The `installers` cache these jobs saved (964 MB on Windows alone)
      # was read by nothing but their next run on main.
      - uses: ./.github/actions/rust-tests-cache
        with:
          nextest: false
      - run: cargo build --locked -p rdownloader -p rd-capture
      - name: Pack a release-layout tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lib/version-file.sh
          source scripts/lib/archive-layout.sh
          mkdir -p stage/plugins
          cp target/debug/rdownloader target/debug/rdownloader-capture LICENSE README.md stage/
          cp scripts/linux/start-rdownloader.sh scripts/linux/stop-rdownloader.sh \
            scripts/linux/start-capture.sh scripts/linux/stop-capture.sh stage/
          rd_write_version_file stage "$(scripts/set-version.sh)" "linux ${ARCH}" debug
          scripts/release-assets.sh fetch-plugins "${GITHUB_REPOSITORY}" stage/plugins
          tar --directory stage --create --gzip --file "rdownloader-linux-${ARCH}.tar.gz" .
          rd_check_archive_layout "rdownloader-linux-${ARCH}.tar.gz" linux
      # The runner's own nfpm build, checked against the SHA-256 in nfpm's checksums.txt.
      - name: Install nfpm
        shell: bash
        env:
          NFPM: ${{ matrix.nfpm }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_${NFPM}.tar.gz"
          echo "${NFPM_SHA256}  ${RUNNER_TEMP}/nfpm.tar.gz" | sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/nfpm.tar.gz" --directory "${RUNNER_TEMP}" nfpm
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Build the deb and the rpm
        run: scripts/package-deb-rpm.sh "rdownloader-linux-${ARCH}.tar.gz" installers
      # The packaged unit runs under the user manager, which a runner starts only with lingering.
      - name: Start a systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "${USER}"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            [[ -S "${runtime}/bus" ]] && break
            sleep 1
          done
          test -S "${runtime}/bus"
          { echo "XDG_RUNTIME_DIR=${runtime}"; echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${runtime}/bus"; } >> "${GITHUB_ENV}"
      - name: Install the deb, upgrade over itself, remove, keep the data
        shell: bash
        run: |
          set -euo pipefail
          home="${HOME}/.local/share/rdownloader"
          db="${home}/data/rdownloader.sqlite3"
          diagnose() {
            journalctl --user --unit rdownloader --no-pager --lines 80 || true
            systemctl --user status rdownloader --no-pager || true
            find "${home}" -maxdepth 3 -print 2> /dev/null || true
            busctl --user list 2> /dev/null | grep -i -e secret -e keyring || true
            # Where a start that never answers is waiting: the service's threads and their wait channels.
            pid="$(systemctl --user show --property MainPID --value rdownloader 2> /dev/null || true)"
            if [[ -n "${pid}" && "${pid}" != 0 ]]; then
              for task in /proc/"${pid}"/task/*; do
                echo "${task##*/} $(cat "${task}/comm" 2> /dev/null) $(cat "${task}/wchan" 2> /dev/null)"
              done
              sudo gdb --batch -p "${pid}" -ex 'thread apply all bt 12' 2> /dev/null | head -n 200 || true
            fi
          }
          trap 'status=$?; [[ ${status} -eq 0 ]] || diagnose' EXIT
          # Five minutes: the stage holds debug binaries, and a debug build's first start
          # compiles every bundled plugin with an unoptimised Cranelift — over four CPU minutes,
          # more than a four-core runner does in the one minute this waited before.
          serve() {
            systemctl --user daemon-reload
            systemctl --user start rdownloader
            curl --fail --silent --show-error --retry 300 --retry-delay 1 --retry-connrefused \
              http://127.0.0.1:8710/api/v1/health > /dev/null
            test -s "${db}"
            systemctl --user stop rdownloader
          }
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils "./installers/rdownloader-linux-${ARCH}.deb"
          test "$(cat /usr/lib/rdownloader/install-kind)" = deb
          # The menu entry and its icon (RD-1120-20).
          desktop-file-validate /usr/share/applications/rdownloader.desktop
          test -s /usr/share/icons/hicolor/scalable/apps/rdownloader.svg
          rdownloader --version
          serve
          # The data went to the user, nothing next to the program.
          test ! -e /usr/lib/rdownloader/data
          echo "installers deb" > "${home}/data/installers-marker"
          mkdir -p "${home}/downloads"
          echo "installers deb" > "${home}/downloads/installers-marker"
          sudo dpkg --install "./installers/rdownloader-linux-${ARCH}.deb"
          serve
          test "$(cat "${home}/data/installers-marker")" = "installers deb"
          sudo dpkg --purge rdownloader
          test ! -e /usr/lib/rdownloader
          test ! -e /usr/lib/systemd/user/rdownloader.service
          test ! -e /usr/share/applications/rdownloader.desktop
          test -s "${db}" || { echo "::error::removing the deb took the database with it"; exit 1; }
          test "$(cat "${home}/downloads/installers-marker")" = "installers deb"
      - name: Install the rpm in Fedora, upgrade over itself, remove, keep the data
        shell: bash
        run: |
          set -euo pipefail
          # fedora:44 is a multi-arch image; each runner pulls its own architecture.
          docker run --rm --env ARCH --volume "${PWD}/installers:/installers:ro" fedora:44 bash -xeuo pipefail -c '
            # The container image has no runuser; util-linux brings it.
            dnf install --assumeyes util-linux "/installers/rdownloader-linux-${ARCH}.rpm"
            test "$(cat /usr/lib/rdownloader/install-kind)" = rpm
            test -s /usr/share/applications/rdownloader.desktop
            useradd --create-home tester
            db=/home/tester/.local/share/rdownloader/data/rdownloader.sqlite3
            serve() {
              # "cd && rdownloader serve &" backgrounds the whole list: $! is then a subshell, the
              # kill below ends only that, and the service lives on holding the port, so the start
              # after the upgrade answered the health check from the old process (1.9.1, 1.10).
              # With ";" only rdownloader is in the background and $! is its own pid.
              runuser -u tester -- bash -c "cd /home/tester || exit 1; rdownloader serve > /tmp/serve.log 2>&1 & echo \$! > /tmp/serve.pid"
              curl --fail --silent --show-error --retry 300 --retry-delay 1 --retry-connrefused \
                http://127.0.0.1:8710/api/v1/health > /dev/null || { cat /tmp/serve.log; exit 1; }
              kill "$(cat /tmp/serve.pid)"
              while kill -0 "$(cat /tmp/serve.pid)" 2> /dev/null; do sleep 1; done
              test -s "${db}"
            }
            serve
            test ! -e /home/tester/data
            runuser -u tester -- bash -c "echo installers-rpm > /home/tester/.local/share/rdownloader/data/installers-marker"
            rpm --upgrade --replacepkgs "/installers/rdownloader-linux-${ARCH}.rpm"
            serve
            rpm --erase rdownloader
            test ! -e /usr/lib/rdownloader || { echo "removing the rpm left /usr/lib/rdownloader:"; find /usr/lib/rdownloader; exit 1; }
            test ! -e /usr/share/applications/rdownloader.desktop
            test -s "${db}" || { echo "removing the rpm took the database with it"; exit 1; }
            test "$(cat /home/tester/.local/share/rdownloader/data/installers-marker)" = installers-rpm
          '

  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - name: Build the web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      # `rust-tests`, read only, as in `linux`.
      - uses: ./.github/actions/rust-tests-cache
        with:
          nextest: false
      - run: cargo build --locked -p rdownloader -p rd-capture
      - name: Stage the release layout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lib/version-file.sh
          mkdir -p stage/plugins
          cp target/debug/rdownloader.exe target/debug/rdownloader-capture.exe LICENSE README.md stage/
          cp scripts/windows/start-rdownloader.bat scripts/windows/stop-rdownloader.bat \
            scripts/windows/start-capture.bat scripts/windows/stop-capture.bat stage/
          rd_write_version_file stage "$(scripts/set-version.sh)" "windows x86_64" debug
          scripts/release-assets.sh fetch-plugins "${GITHUB_REPOSITORY}" stage/plugins
      - name: Install WiX
        uses: ./.github/actions/install-wix
      # Two builds of one version: each gets a product code of its own, so the second installs as
      # the major upgrade of the first, as a release does over the one before it.
      - name: Build the MSI twice, and once in German; the capture agent's twice
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-msi.sh stage installers/first/rdownloader-windows-x86_64.msi
          scripts/package-msi.sh stage installers/second/rdownloader-windows-x86_64.msi
          scripts/package-msi.sh stage installers/de/rdownloader-windows-x86_64-de.msi de
          scripts/release-assets.sh agent-stage stage capture-stage
          scripts/package-msi.sh --capture capture-stage installers/capture-first/rdownloader-capture-windows-x86_64.msi
          scripts/package-msi.sh --capture capture-stage installers/capture-second/rdownloader-capture-windows-x86_64.msi
      - name: Install, upgrade with AUTOSTART=1, uninstall, keep the data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $program = Join-Path $env:LOCALAPPDATA 'Programs\rDownloader'
          $home_ = Join-Path $env:LOCALAPPDATA 'rDownloader'
          $db = Join-Path $home_ 'data\rdownloader.sqlite3'
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\rDownloader'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function Msi($arguments, $log) {
            $process = Start-Process msiexec.exe -ArgumentList "$arguments /qn /l*v $log" -Wait -PassThru
            if ($process.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msiexec $arguments exited with $($process.ExitCode)" }
          }
          function Serve {
            $env:RDOWNLOADER_NO_PAUSE = '1'
            & "$program\start-rdownloader.bat" server
            if ($LASTEXITCODE -ne 0) { throw "start-rdownloader.bat failed" }
            $healthy = $false
            for ($i = 0; $i -lt 300; $i++) {
              try { Invoke-RestMethod http://127.0.0.1:8710/api/v1/health | Out-Null; $healthy = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $healthy) { Get-Content (Join-Path $home_ 'logs\rdownloader.err.log') -ErrorAction SilentlyContinue; throw "no health answer" }
            if (-not (Test-Path $db)) { throw "no database at $db" }
          }
          Msi '/i installers\first\rdownloader-windows-x86_64.msi' first.log
          if ((Get-Content "$program\install-kind").Trim() -ne 'msi') { throw "install-kind is not msi" }
          foreach ($entry in 'rDownloader', 'rDownloader Capture', 'Stop rDownloader') {
            if (-not (Test-Path "$menu\$entry.lnk")) { throw "no Start menu entry $entry" }
          }
          Serve
          # Data and logs with the user, nothing in the program folder.
          if (Test-Path "$program\data") { throw "the service wrote data into the program folder" }
          if (-not (Test-Path "$home_\logs\rdownloader.log")) { throw "the launcher's log is not in $home_\logs" }
          Set-Content "$home_\data\installers-marker" 'installers msi'
          New-Item -ItemType Directory -Force "$home_\downloads" | Out-Null
          Set-Content "$home_\downloads\installers-marker" 'installers msi'
          # Another program owns .dlc before the agent's association is installed (RD-1260-09).
          $classes = 'HKCU:\Software\Classes'
          New-Item "$classes\.dlc" -Force -Value 'Other.Container' | Out-Null
          $desktopLink = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Add to rDownloader.lnk'
          $sendToLink = Join-Path ([Environment]::GetFolderPath('SendTo')) 'rDownloader.lnk'
          $verb = "$classes\SystemFileAssociations\.dlc\shell\rDownloader.Import\command"
          $offered = "$classes\Applications\rdownloader-capture.exe"
          # The upgrade stops the running service itself (the old version's StopRunning).
          Msi '/i installers\second\rdownloader-windows-x86_64.msi AUTOSTART=1 ASSOCIATION=1 DROPSHORTCUT=1 SENDTO=1' second.log
          if (Get-Process rdownloader -ErrorAction SilentlyContinue) { throw "the upgrade left the old service running" }
          $autostart = (Get-ItemProperty $run -Name 'rDownloader Service' -ErrorAction SilentlyContinue).'rDownloader Service'
          if (-not $autostart) { throw "AUTOSTART=1 registered no autostart" }
          Write-Host "autostart: $autostart"
          # The three switches: the association with its verb and Open with entry, the drop
          # shortcut and Send to; the other program's default for .dlc is still its own.
          if (-not (Test-Path $verb)) { throw "ASSOCIATION=1 registered no 'Import into rDownloader' for .dlc" }
          if (-not (Test-Path "$offered\SupportedTypes")) { throw "ASSOCIATION=1 put the agent in no Open with list" }
          if ((Get-Item "$classes\.dlc").GetValue('') -ne 'Other.Container') { throw "the association took the .dlc default of another program" }
          if (-not (Test-Path $desktopLink)) { throw "DROPSHORTCUT=1 put no shortcut on the desktop" }
          if (-not (Test-Path $sendToLink)) { throw "SENDTO=1 put no entry in Send to" }
          Serve
          if ((Get-Content "$home_\data\installers-marker") -ne 'installers msi') { throw "the data marker did not survive the upgrade" }
          Msi '/x installers\second\rdownloader-windows-x86_64.msi' remove.log
          if (Test-Path "$program\rdownloader.exe") { throw "the uninstall left the program behind" }
          if (Test-Path $menu) { throw "the uninstall left the Start menu folder behind" }
          if (Get-ItemProperty $run -Name 'rDownloader Service' -ErrorAction SilentlyContinue) { throw "the uninstall left the autostart entry behind" }
          foreach ($left in $verb, $offered, "$classes\rDownloader.NZB", $desktopLink, $sendToLink) {
            if (Test-Path -LiteralPath $left) { throw "the uninstall left $left behind" }
          }
          if ((Get-Item "$classes\.dlc").GetValue('') -ne 'Other.Container') { throw "the uninstall took the .dlc default of another program" }
          Remove-Item "$classes\.dlc" -Recurse -Force
          if (-not (Test-Path $db)) { throw "the uninstall took the database with it" }
          if ((Get-Content "$home_\downloads\installers-marker") -ne 'installers msi') { throw "the uninstall took the downloads with it" }
          # A language other than English (RD-1120-20): silent, its own strings bound, removed.
          Msi '/i installers\de\rdownloader-windows-x86_64-de.msi' de.log
          if (-not (Test-Path "$menu\rDownloader beenden.lnk")) { throw "the German MSI has no entry 'rDownloader beenden'" }
          Msi '/x installers\de\rdownloader-windows-x86_64-de.msi' de-remove.log
          if (Test-Path $menu) { throw "the German uninstall left the Start menu folder behind" }
      # RD-1390-04: the capture agent's own MSI, after the full product's step left only its data.
      - name: The capture agent's MSI - autostart, switches, upgrade, uninstall, the full MSI beside it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capture = Join-Path $env:LOCALAPPDATA 'Programs\rDownloader Capture'
          $program = Join-Path $env:LOCALAPPDATA 'Programs\rDownloader'
          $db = Join-Path $env:LOCALAPPDATA 'rDownloader\data\rdownloader.sqlite3'
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\rDownloader Capture'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $wrapper = Join-Path $env:APPDATA 'rDownloader\rDownloader\config\autostart\rdownloader-capture.cmd'
          $classes = 'HKCU:\Software\Classes'
          $offered = "$classes\Applications\rdownloader-capture.exe"
          $desktopLink = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Add to rDownloader.lnk'
          $sendToLink = Join-Path ([Environment]::GetFolderPath('SendTo')) 'rDownloader.lnk'
          $first = 'installers\capture-first\rdownloader-capture-windows-x86_64.msi'
          $second = 'installers\capture-second\rdownloader-capture-windows-x86_64.msi'
          function Msi($arguments, $log) {
            $process = Start-Process msiexec.exe -ArgumentList "$arguments /qn /l*v $log" -Wait -PassThru
            if ($process.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msiexec $arguments exited with $($process.ExitCode)" }
          }
          function Autostart { (Get-ItemProperty $run -Name 'rDownloader Capture' -ErrorAction SilentlyContinue).'rDownloader Capture' }
          function Installed { Test-Path "$capture\rdownloader-capture.exe" }
          if (-not (Test-Path $db)) { throw "the full product's step left no database to keep" }
          # A silent install with every switch: the agent, its marker, its menu, its autostart.
          Msi "/i $first AUTOSTART=1 ASSOCIATION=1 DROPSHORTCUT=1 SENDTO=1" capture-first.log
          if (Test-Path "$capture\rdownloader.exe") { throw "the capture MSI installed the service" }
          if ((Get-Content "$capture\install-kind").Trim() -ne 'msi') { throw "install-kind is not msi" }
          & "$capture\rdownloader-capture.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "rdownloader-capture.exe --version failed" }
          foreach ($entry in 'rDownloader Capture', 'Stop rDownloader Capture') {
            if (-not (Test-Path "$menu\$entry.lnk")) { throw "no Start menu entry $entry" }
          }
          if (-not (Autostart)) { throw "AUTOSTART=1 registered no autostart" }
          foreach ($entry in $offered, $desktopLink, $sendToLink) {
            if (-not (Test-Path -LiteralPath $entry)) { throw "the switches left $entry out" }
          }
          # The uninstall takes the autostart and the integrations, never the data.
          Msi "/x $first" capture-remove.log
          if (Installed) { throw "the uninstall left the agent behind" }
          if (Test-Path $menu) { throw "the uninstall left the Start menu folder behind" }
          if (Autostart) { throw "the uninstall left the autostart entry behind" }
          foreach ($left in $offered, $desktopLink, $sendToLink) {
            if (Test-Path -LiteralPath $left) { throw "the uninstall left $left behind" }
          }
          if (-not (Test-Path $db)) { throw "the capture uninstall took the data with it" }
          # Without AUTOSTART=1 no autostart; with it, then switched off, an upgrade keeps it off
          # and starts no agent.
          Msi "/i $first" capture-plain.log
          if (Autostart) { throw "an install without AUTOSTART=1 registered the autostart" }
          Msi "/x $first" capture-plain-remove.log
          Msi "/i $first AUTOSTART=1" capture-autostart.log
          & "$capture\rdownloader-capture.exe" autostart remove
          if ($LASTEXITCODE -ne 0 -or (Autostart)) { throw "autostart remove did not remove the entry" }
          # Under /qn there is no finish page: its launch after an upgrade (only with the autostart
          # registered) is checked live, not here. The two shortcuts are for the takeover below.
          Msi "/i $second DROPSHORTCUT=1 SENDTO=1" capture-upgrade.log
          if (-not (Installed)) { throw "the upgrade left no agent" }
          if (Autostart) { throw "the upgrade registered the autostart that was switched off" }
          if (Get-Process rdownloader-capture -ErrorAction SilentlyContinue) { throw "the upgrade started the agent" }
          foreach ($link in $desktopLink, $sendToLink) {
            if (-not (Test-Path -LiteralPath $link)) { throw "the upgrade's switches left $link out" }
          }
          # Beside the full product the capture MSI refuses, and the full MSI replaces it, taking its
          # autostart, association, drop shortcut and Send to entry over for its own folder.
          foreach ($integration in 'autostart', 'association') {
            & "$capture\rdownloader-capture.exe" $integration install
            if ($LASTEXITCODE -ne 0) { throw "$integration install failed" }
          }
          Msi '/i installers\first\rdownloader-windows-x86_64.msi' full-over-capture.log
          if (Installed) { throw "the full MSI left the capture MSI's agent behind" }
          if (Get-ItemProperty 'HKCU:\Software\rDownloader Capture\Installer' -Name Program -ErrorAction SilentlyContinue) { throw "the full MSI left the capture MSI installed" }
          if (-not (Autostart)) { throw "the full MSI dropped the agent's autostart" }
          if (-not ((Get-Content $wrapper -Raw) -like "*$program\rdownloader-capture.exe*")) { Get-Content $wrapper; throw "the agent's autostart does not name the full product's agent" }
          $open = (Get-Item "$offered\shell\open\command").GetValue('')
          if (-not ($open -like "*$program\rdownloader-capture.exe*")) { throw "the association names $open, not the full product's agent" }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($link in $desktopLink, $sendToLink) {
            if (-not (Test-Path -LiteralPath $link)) { throw "the full MSI dropped $link" }
            $target = $shell.CreateShortcut($link).TargetPath
            if ($target -ne "$program\rdownloader-capture.exe") { throw "$link names $target, not the full product's agent" }
          }
          $process = Start-Process msiexec.exe -ArgumentList "/i $second /qn /l*v capture-beside-full.log" -Wait -PassThru
          if ($process.ExitCode -eq 0) { throw "the capture MSI installed beside the full product" }
          if (-not (Select-String -Path capture-beside-full.log -Pattern 'already contains the capture agent' -Quiet)) { Get-Content capture-beside-full.log -Tail 40; throw "the refusal does not say why" }
          if (Installed) { throw "the refused capture MSI left files behind" }
          Msi '/x installers\first\rdownloader-windows-x86_64.msi' full-remove.log
          if (Autostart) { throw "the full uninstall left the agent's autostart behind" }
          foreach ($left in $offered, $desktopLink, $sendToLink) {
            if (Test-Path -LiteralPath $left) { throw "the full uninstall left $left behind" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: installers-msi-logs
          path: "*.log"
          retention-days: 7

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `rust-tests`, read only, as in `linux`.
      - uses: ./.github/actions/rust-tests-cache
        with:
          nextest: false
      - run: cargo build --locked -p rd-capture
      # The helper as release.yml builds it, beside the agent as in the archive.
      - name: Build the helper app beside the agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir stage
          cp target/debug/rdownloader-capture stage/
          osacompile -o "stage/rDownloader Capture.app" resources/macos/rdownloader-capture.applescript
          cp resources/macos/capture-helper-Info.plist "stage/rDownloader Capture.app/Contents/Info.plist"
          plutil -lint "stage/rDownloader Capture.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" \
            "stage/rDownloader Capture.app/Contents/Info.plist" | grep -qx rdownloader
      - name: Register and remove the rdownloader:// scheme
        shell: bash
        run: |
          set -euo pipefail
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          claims() { "${lsregister}" -dump | grep -c 'rdownloader:' || true; }
          before="$(claims)"
          stage/rdownloader-capture scheme install
          after="$(claims)"
          echo "claims of rdownloader: before ${before}, after install ${after}"
          [[ "${after}" -gt "${before}" ]] || { echo "::error::scheme install left Launch Services without the claim"; exit 1; }
          stage/rdownloader-capture scheme remove
          removed="$(claims)"
          echo "after remove ${removed}"
          [[ "${removed}" -le "${before}" ]] || { echo "::error::scheme remove left the claim behind"; exit 1; }
