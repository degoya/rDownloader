name: Package repositories

# RD-180-10: the apt and dnf repositories that scripts/package-repo.sh writes, installed from as a
# user would. The `build` job runs scripts/tests/package-repo.sh with every tool it needs, so both
# halves run, and keeps two states of a fixture repository signed with the test's throwaway key:
# 1 holds rdownloader 1.0.0, 2 holds 1.1.0 and 1.2.0 (1.0.0 dropped by --keep 2). Each install job
# serves a state at file:///repo, adds the key and the .sources or .repo file exactly as the
# README says, installs, upgrades to the next state, downgrades to the kept older version, and
# then shows that a repository whose signed index was altered fails the update with a non-zero exit,
# installs nothing and offers nothing — the signature is checked, nothing says trusted=yes, and
# dnf does not skip the repository with a warning — and that the same state unaltered installs
# again, so the failure is the signature's. The fixture packages only carry a version file; what
# the real packages do on upgrade and removal is RD-180-05's installer CI.
#
# apt, dnf and zypper (openSUSE Tumbleweed, the same rpm half through the README's
# `zypper addrepo`) each run on ubuntu-24.04 and ubuntu-24.04-arm, so every client takes the
# amd64/x86_64 and the arm64/aarch64 package from the same indexes (RD-190-12). The container
# images are multi-arch; each runner pulls its own architecture.
on:
  push:
    branches: ["**", "!dependabot/**"]
    paths:
      - ".github/workflows/packages-repo.yml"
      - "packaging/repository/**"
      - "scripts/package-repo.sh"
      - "scripts/ci-package-repo.sh"
      - "scripts/tests/package-repo.sh"
  # The same list as above; keep the two in step.
  pull_request:
    paths:
      - ".github/workflows/packages-repo.yml"
      - "packaging/repository/**"
      - "scripts/package-repo.sh"
      - "scripts/ci-package-repo.sh"
      - "scripts/tests/package-repo.sh"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils rpm createrepo-c
      - name: Test scripts/package-repo.sh and keep two repository states
        run: scripts/tests/package-repo.sh --out repo-states
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-repo-states
          path: repo-states
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # One matrix over the clients (RD-1280-15: three jobs with the same step pair before); the
  # steps are scripts/ci-package-repo.sh's, per package manager. apt runs on Ubuntu and Debian.
  # zypper reads the same rdownloader.repo as dnf (the script says what differs).
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:stable", "fedora:latest", "opensuse/tumbleweed"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - image: "ubuntu:24.04"
            pm: apt
          - image: "debian:stable"
            pm: apt
          - image: "fedora:latest"
            pm: dnf
          - image: "opensuse/tumbleweed"
            pm: zypper
    name: install (${{ matrix.pm }}, ${{ matrix.image }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # The script only: the images need not carry git, and checkout falls back to the API then.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-package-repo.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-repo-states
          path: states
      - name: Install from the repository, upgrade and downgrade
        env:
          PM: ${{ matrix.pm }}
        run: bash scripts/ci-package-repo.sh "${PM}" install
      - name: An altered index is refused
        env:
          PM: ${{ matrix.pm }}
        run: bash scripts/ci-package-repo.sh "${PM}" refused
