name: Advisories

# The RustSec database moves between pushes: a dependency nobody touched can gain an advisory any
# day, and ci.yml's `supply-chain` job only sees it at the next push. This asks once a week on
# the default branch, which in the public repository is `main`, the last release (RD-140-25).
# Advisories only: licences, bans and sources change with the tree, and ci.yml checks those on
# every push. A finding here is fixed or waived in deny.toml in the development repository and
# arrives with the next export.
#
# `osv` asks the same of what is no crate (RD-1480-14, SEC-5): the container's Python tools and the
# interface's npm packages, through scripts/advisories.sh, which says how a finding is fixed or
# waived. Nothing is installed for it.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories

  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python tools of the image and npm packages of the interface
        run: scripts/advisories.sh
