name: Recovery

# Axis B of the recovery matrix (RD-180-12, crates/rd-core/recovery-matrix.md): a real
# `rdownloader serve` is killed with SIGKILL mid-download and mid-post-processing, started again
# on the same data, and held to the matrix's invariants. The cases are `#[ignore]` everywhere
# else, because each spawns a service; this job is where they run. Linux only: SIGKILL is the
# point, and the state machine behind it is the same on every system (axis A, ci.yml). The
# release candidate dispatches it before the tag, and a red run holds the tag (owner, 2026-10-06;
# the `public-ci` step, scripts/lib/release-steps-publish.sh).
on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # RUSTUP_TOOLCHAIN: set by .github/actions/setup-rust for every step after it (RD-191-09).
  CARGO_INCREMENTAL: 0

jobs:
  axis-b:
    name: Kill and restart (axis B)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk
      # rust-embed compiles web/dist into rd-api. These cases never open the interface, so a
      # placeholder page stands in for the web build the `web` job of ci.yml makes.
      - name: Placeholder web interface
        run: mkdir -p web/dist && printf '<!doctype html><title>rDownloader</title>\n' > web/dist/index.html
      # ci.yml's `rust-tests` cache, read only (RD-1120-07): a debug build of the same workspace
      # with the same linkers. The cache of its own this job saved on main (927 MB) was read by
      # nothing but its next run there.
      - uses: ./.github/actions/rust-tests-cache
      # `--run-ignored only`: exactly the axis B cases, one spawned service each. The service
      # logs of a failed case are part of its failure message.
      - name: Kill and restart cases
        run: cargo nextest run --locked --no-fail-fast -p rdownloader --test kill_restart --run-ignored only
