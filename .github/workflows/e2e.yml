name: E2E

# End to end on the operating systems themselves (RD-180-12): the capture agent against a fresh
# service on Linux, Windows and macOS — pairing, `configure`, `run`, a link through the
# `rdownloader://` handler and one through Click'n'Load, both asserted in the LinkGrabber, and
# the autostart entry installed and removed — and on Linux the built Chrome extension in
# Chromium, paired through its options page, sending a page from its popup, and taking a hoster
# page's Click'n'Load without an agent and leaving it to one (RD-1260-10). The same test files
# run locally through scripts/e2e.sh. Firefox cannot load an unpacked extension under Playwright;
# its build is linted by ci.yml (`web-ext lint`) and its run is a live-checklist item in
# docs/development.md.
#
# Each step has a time budget (web/e2e/lib/service.mjs, BUDGET_MS); a step over it fails the run.
#
# The release candidate dispatches it before the tag, beside ci.yml, and a red run holds the tag
# (owner, 2026-10-06; the `public-ci` step, scripts/lib/release-steps-publish.sh). The push to
# `main` after the tag carries that same tree: there the `gate` job runs only the legs no
# successful run of this tree passed (RD-1270-11).

on:
  push:
    branches: ["**", "!dependabot/**"]
    paths:
      - ".github/workflows/e2e.yml"
      - "Cargo.lock"
      - "crates/rdownloader/**"
      - "crates/rd-api*/**"
      - "crates/rd-autostart/**"
      - "crates/rd-capture/**"
      - "crates/rd-collector/**"
      - "crates/rd-core/**"
      - "crates/rd-db/**"
      - "crates/rd-plugin-types/**"
      - "extension/**"
      - "scripts/e2e.sh"
      - "web/e2e/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
  # The same list as above; keep the two in step.
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "Cargo.lock"
      - "crates/rdownloader/**"
      - "crates/rd-api*/**"
      - "crates/rd-autostart/**"
      - "crates/rd-capture/**"
      - "crates/rd-collector/**"
      - "crates/rd-core/**"
      - "crates/rd-db/**"
      - "crates/rd-plugin-types/**"
      - "extension/**"
      - "scripts/e2e.sh"
      - "web/e2e/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
  # By hand for any ref, optionally on fewer runners:
  #   gh workflow run e2e.yml --ref <branch> -f platforms='["ubuntu-24.04"]'
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON list of runner images for the smoke job
        required: false
        default: '["ubuntu-24.04","windows-2025","macos-15"]'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # RUSTUP_TOOLCHAIN: set by .github/actions/setup-rust for every step after it (RD-191-09).
  CARGO_INCREMENTAL: 0

jobs:
  # What this run has to check, as ci.yml's `gate` decides it (scripts/ci-gate.sh): every image,
  # except on a push to `main`, where only the images no successful run of e2e.yml passed as a
  # `smoke (<image>)` leg over this tree, or over one that differs from it only in documentation
  # and the version bump (CI_TREE_GREENS_UP_TO_VERSIONS: the green usually comes from the wave's
  # integration branch, RD-1270-10) — after a release, usually none. A tree nobody checked, or a
  # GitHub that does not answer, gets every image.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
      check: ${{ steps.platforms.outputs.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The runner images still to check
        id: platforms
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.platforms || '["ubuntu-24.04","windows-2025","macos-15"]' }}
          ONCE: "[]"
          CI_TREE_GREENS_WORKFLOW: e2e.yml
          CI_TREE_GREENS_LEG: smoke
          CI_TREE_GREENS_UP_TO_VERSIONS: "1"
        run: scripts/ci-gate.sh

  web:
    needs: gate
    if: needs.gate.outputs.check == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1
      - run: scripts/build-extension.sh --skip-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-chrome-extension
          path: artifacts/browser-extensions/chrome
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: [gate, web]
    # Skipped, not an empty matrix, when the gate leaves no image.
    if: needs.gate.outputs.check == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # A keychain call that waits for ever is cut off here, not after six hours. The Linux and
    # Windows legs build in about five minutes with the cache; macOS has none and builds cold.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-web-dist
          path: web/dist
      # ci.yml's `rust-tests` cache, read only (RD-1270-11), as installers.yml builds the same two
      # packages against it: a debug build whose dependencies, linkers and environment are those
      # of the `rust` job's test build, which `rust` and `warm-cache` save on main for Linux and
      # Windows. Until 1.27 this leg built `release-test` and read `docker`'s cache, which no run
      # ever saved — `docker` runs on main only for a tree no branch checked — so every leg built
      # cold: Windows 40 minutes for a smoke of seconds, Linux 21, macOS 24 (run 38230320849).
      # macOS keeps no `rust-tests` cache and builds cold, in debug a fraction of that. A debug
      # build is well inside the budgets (BUDGET_MS): its service answers in under a second
      # against 45 s, its agent in a fraction of 20 s. Both packages in one build: rd-capture
      # alone resolves features no cached build has and rebuilds about 160 dependencies, the two
      # together 25 to 40 (`cargo tree` against the test build's resolution, 2026-10-12).
      - uses: ./.github/actions/rust-tests-cache
        with:
          nextest: false
      - name: Build the service and the capture agent
        run: cargo build --locked -p rdownloader -p rd-capture
      - uses: ./.github/actions/setup-web
        with:
          pnpm: false

      # A hosted Linux runner has no login session, so `systemctl --user` has no manager to talk
      # to. Lingering starts one; its bus is what `autostart install` enables the unit through.
      - name: Start a systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          bus="/run/user/$(id -u)/bus"
          for _ in $(seq 1 30); do [[ -S "$bus" ]] && break; sleep 1; done
          [[ -S "$bus" ]] || { echo "no user bus at $bus" >&2; exit 1; }
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$bus" >> "$GITHUB_ENV"
      # The runner's login keychain is locked, and a keychain call against it waits for ever
      # (the 1.2.4 captcha-test hang). An unlocked default keychain of the job's own takes the
      # service's master key and the agent's capture token without a prompt.
      - name: Unlocked default keychain
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/rd-e2e.keychain-db"
          security create-keychain -p rd-e2e "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p rd-e2e "$keychain"
          # shellcheck disable=SC2046 # one argument per keychain the list names
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

      - name: Capture agent smoke
        env:
          RD_E2E_SERVER: ${{ github.workspace }}/target/debug/rdownloader${{ env.EXE }}
          RD_E2E_CAPTURE: ${{ github.workspace }}/target/debug/rdownloader-capture${{ env.EXE }}
          RD_E2E_OS_INTEGRATION: "1"
          RD_E2E_WORK: ${{ runner.temp }}/e2e-capture
        run: node --test --test-reporter=spec web/e2e/capture.e2e.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.os == 'Linux'
        with:
          package_json_file: web/package.json
      - name: Install Playwright's Chromium
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Linux'
        with:
          name: e2e-chrome-extension
          path: ${{ runner.temp }}/chrome-extension
      - name: Chrome extension end to end
        if: runner.os == 'Linux'
        env:
          RD_E2E_SERVER: ${{ github.workspace }}/target/debug/rdownloader
          RD_E2E_EXTENSION: ${{ runner.temp }}/chrome-extension
          RD_E2E_WORK: ${{ runner.temp }}/e2e-extension
        run: node --test --test-reporter=spec web/e2e/extension.e2e.mjs
      # RD-1260-10: Click'n'Load through the extension, without an agent and beside one.
      - name: Click'n'Load through the Chrome extension
        if: runner.os == 'Linux'
        env:
          RD_E2E_SERVER: ${{ github.workspace }}/target/debug/rdownloader
          RD_E2E_EXTENSION: ${{ runner.temp }}/chrome-extension
          RD_E2E_WORK: ${{ runner.temp }}/e2e-click-and-load
        run: node --test --test-reporter=spec web/e2e/click-and-load.e2e.mjs

      # Logs only: the work directories also hold the throwaway vault key and capture token.
      - name: Upload the service and agent logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ runner.os }}
          path: ${{ runner.temp }}/e2e-*/**/*.log
          if-no-files-found: ignore
          retention-days: 7
