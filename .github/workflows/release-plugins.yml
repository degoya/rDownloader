name: Release plugins

# The signed plugins of a release, called by release.yml's `plugins` job (RD-1101-07): every
# bundled plugin built as a wasm component, the packager `rd-pack`, the packages signed with the
# plugin key and the plugin index signed with the repository key. Its artifacts (`packager`,
# `plugins`, `plugin-index`) belong to the release run and are what `packages`, `publish` and the
# container jobs download; `plugin-components` is this workflow's own and dropped by `publish`.
# Since RD-1230-03 a release carries no site-rule file: the app brings its examples.
#
# Three jobs (RD-1480-14, SEC-6). `components` and `packager` compile — the plugins' and the
# packager's dependencies with their build scripts and proc macros — and hold no key. `sign` holds
# the two keys and compiles nothing: it takes what the other two built, held to the SHA-256 they
# put out, and runs our scripts and `rd-pack` alone. What it does not take away: `rd-pack` itself,
# which links its dependencies, signs with the key.
#
# The components come from no cache. Until 1.47 they came from the one ci.yml fills on `main`,
# whose stamps hash the sources and not the `.wasm`, so a poisoned cache entry would have been
# signed.
#
# No `environment:` yet: GitHub creates a named environment that does not exist, without its
# protection, and the owner has to move the secrets into it. docs/development.md ("Signing keys in
# an environment") has the steps; nothing here changes but one line in `sign`.
on:
  workflow_call:
    secrets:
      RDOWNLOADER_PLUGIN_SIGNING_KEY: {required: false}
      RDOWNLOADER_REPOSITORY_SIGNING_KEY: {required: false}

# As in release.yml: read-only.
permissions:
  contents: read

env:
  # release.yml's, which a called workflow does not inherit.
  CARGO_TERM_COLOR: always
  PLUGIN_RELEASE_TAG: plugins-${{ github.ref_name }}

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      sha256: ${{ steps.hand-over.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      # No cache of any kind, see above: every component is built here, from this tag's sources.
      # Makes each core module a component (RD-1110-08), and reads the imports for the check
      # scripts/build-plugins.sh runs on every component it builds and the one below over all of
      # them; the version the script requires.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-tools@1.261.0
      - name: Collect the bundled plugins
        id: plugins
        shell: bash
        run: scripts/ci-plugins.sh list
      - name: Build plugin components
        shell: bash
        run: scripts/build-plugins.sh --components-only
      - name: Reject accidental WASI capabilities
        shell: bash
        run: scripts/ci-plugins.sh imports ${{ steps.plugins.outputs.names }}
      - name: Hand the components over
        id: hand-over
        shell: bash
        run: scripts/ci-plugins.sh hand-over plugin-components.tar ${{ steps.plugins.outputs.packageable }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-components
          path: plugin-components.tar
          if-no-files-found: error
          retention-days: 1

  # The packager, `rd-pack` (RD-150-20): the `plugin` commands of `rdownloader` without building
  # the service or `web/dist`. `release-test` because it compiles every component with Wasmtime;
  # `release`'s single code unit and LTO buy a tool nothing. The packages it writes are the same
  # bytes either way, and the embedded roots are the same.
  packager:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo build --locked --profile release-test -p rd-pack
      - name: Its SHA-256
        id: digest
        shell: bash
        run: scripts/ci-plugins.sh digest target/release-test/rd-pack
      # RD-180-01: `publish` builds the update manifest with it, after the checksums exist.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packager
          path: target/release-test/rd-pack
          if-no-files-found: error

  sign:
    needs: [components, packager]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-components
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packager
          path: target/release-test
      # Through the environment, never into the command line: an output comes from a job that ran
      # code of third parties. The plugins to sign are read from this checkout again for the same
      # reason.
      - name: Take the components and the packager over
        shell: bash
        env:
          COMPONENTS_SHA256: ${{ needs.components.outputs.sha256 }}
          PACKAGER_SHA256: ${{ needs.packager.outputs.sha256 }}
        run: scripts/ci-plugins.sh take-over plugin-components.tar
      - name: Package and sign bundled plugins
        env:
          RDOWNLOADER_PLUGIN_SIGNING_KEY: ${{ secrets.RDOWNLOADER_PLUGIN_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(scripts/build-plugins.sh --list-packageable | sort)"
          mapfile -t plugins <<< "${names}"
          scripts/ci-plugins.sh package-signed "${plugins[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins
          path: dist/plugins/*.rdplug
          if-no-files-found: error
      # RD-140-01: the signed plugin repository index, over exactly the packages above. It names
      # each package by the digest of these bytes, so it can be built nowhere else. `verify`
      # checks it against the root this build embeds, which also catches a secret that is not
      # the repository key. Until the secret exists the release carries no index. Its URLs are
      # absolute, into the plugin release; the index itself is an asset of the application
      # release, so `releases/latest/download/rdownloader-plugin-index.json` keeps finding it.
      # RD-1260-02: the index published so far — the latest release's, since this one is not
      # published yet — is carried over, so per plugin and `rdownloader:plugin` contract the last
      # version stays offered to installations that still speak an older contract. Its URLs point
      # into the plugin releases that published them. None found (the first index) carries
      # nothing over.
      - name: Build and sign the plugin index
        env:
          RDOWNLOADER_REPOSITORY_SIGNING_KEY: ${{ secrets.RDOWNLOADER_REPOSITORY_SIGNING_KEY }}
        shell: bash
        run: |
          if [[ -z "${RDOWNLOADER_REPOSITORY_SIGNING_KEY}" ]]; then
            echo "::warning::RDOWNLOADER_REPOSITORY_SIGNING_KEY is not set; this release publishes no plugin index"
            exit 0
          fi
          mkdir -p dist/plugin-index dist/plugin-index-previous
          previous=()
          if curl -fsSL --retry 3 -o dist/plugin-index-previous/rdownloader-plugin-index.json \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/rdownloader-plugin-index.json"; then
            previous=(--previous dist/plugin-index-previous/rdownloader-plugin-index.json)
          else
            echo "::warning::no published plugin index found; this index carries no older versions"
          fi
          target/release-test/rd-pack plugin index build dist/plugins \
            --out dist/plugin-index/rdownloader-plugin-index.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${PLUGIN_RELEASE_TAG}/" \
            --revocations crates/rd-plugin-host/resources/plugin-index-revocations.json \
            --notes dist/plugin-notes "${previous[@]}"
          target/release-test/rd-pack plugin index verify \
            dist/plugin-index/rdownloader-plugin-index.json --packages dist/plugins "${previous[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-index
          path: dist/plugin-index/rdownloader-plugin-index.json
          if-no-files-found: ignore
