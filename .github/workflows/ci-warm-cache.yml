name: CI warm cache

# Keeps main's Rust cache current when the gate leaves platforms out (RD-1100-13). The caches
# are saved from main only and every ci/* run restores main's; a release pushes to main a tree
# that is green already, `rust` then does not run there, and nothing would renew the cache after
# a toolchain or Cargo.lock change — the next wave's run would start cold (Linux 45 min against
# 31 with main's cache, 2026-10-04). This builds what `rust` builds, clippy and every test
# executable through scripts/ci-rust-tests.sh, runs nothing, and saves. Linux and Windows only:
# macOS is checked at a release candidate and keeps no cache.
#
# Sizes against the repository's 10 GB (RD-1120-07, measured 2026-10-06 at 10.6 GB): the
# `rust-tests` cache 2.4 GB on Linux and 2.0 GB on Windows, `components` and the two `docker` legs
# ~1 GB each, the component and Docker layer caches a few hundred MB. Only jobs whose cache a
# later run reads save one; E2E, Recovery, Self-update and Installers saved 5.3 GB more until 1.12
# and now read `rust-tests` (E2E on Linux `docker`'s) and save none. The table is in
# docs/roadmap/jobs/1120-07-pipeline-github-workflows.md.
#
# Called by ci.yml's `warm-cache` job once per image the gate left out (RD-1101-07 split it off;
# the job is unchanged).
on:
  workflow_call:
    inputs:
      os:
        description: The runner image, one leg of the caller's matrix
        required: true
        type: string

# As in ci.yml: nothing by default, the job names what it needs.
permissions: {}

env:
  # ci.yml's, which a called workflow does not inherit; the Rust cache's key includes it.
  CARGO_INCREMENTAL: 0

jobs:
  warm-cache:
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        if: runner.os != 'Windows'
        uses: ./.github/actions/free-runner-disk
      # rust-embed wants web/dist to exist; nothing here serves it, so no `web` job for it.
      - name: Placeholder web interface
        shell: bash
        run: mkdir -p web/dist && printf '<!doctype html><title>rDownloader</title>\n' > web/dist/index.html
      # ci.yml's `rust` job's linkers, toolchain and cache, saved as there.
      - uses: ./.github/actions/rust-tests-cache
        with:
          components: rustfmt, clippy
          save: true
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test executables, built and not run
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: scripts/ci-rust-tests.sh --no-run
