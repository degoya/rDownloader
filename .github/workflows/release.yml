name: Release

on:
  push:
    # Anchored at the start, so the plugin release's tag `plugins-vX.Y.Z` (`publish`) never
    # matches; that tag is also created with the run's GITHUB_TOKEN, whose events start no
    # workflow. scripts/tests/release-assets.sh checks every workflow against both tags.
    tags:
      - "v*.*.*"

# Read-only by default; the two jobs that publish name what they write (RD-140-25): `publish`
# the release and its keyless checksum signature, `container` the image and its signature.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The signed plugins are a release of their own on the same commit (owner, 2026-10-04): v1.9.0
  # listed 69 `.rdplug` files before the installers. The plugin index stays in the application
  # release, where installations look for it, and points here.
  PLUGIN_RELEASE_TAG: plugins-${{ github.ref_name }}

# Runner images are named rather than `-latest`, for the reason in ci.yml (RD-120-67): here the
# image also sets the glibc floor of the shipped Linux binary, which must not move by itself.

jobs:
  extensions:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
        with:
          pnpm: false
      - run: scripts/build-extension.sh
      # The stores get these ZIPs after the release, in `extension-stores` (RD-170-10).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-extensions
          path: artifacts/browser-extensions/*.zip
          if-no-files-found: error

  # The web interface once for the five binary legs, which embed it (RD-1120-07): each of them
  # installed, type-checked and built it itself before, 2-3 minutes a leg and five builds of one
  # `dist`. A tarball rather than the directory: `publish` downloads every artifact of the run
  # into one directory, and scripts/release-assets.sh split drops `web-dist.tar` there.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - run: pnpm --dir web install --frozen-lockfile
      # `run build` stopped type-checking in RD-120-25; named here so it still does.
      - run: pnpm --dir web run typecheck:full
      - run: pnpm --dir web run build
      - run: tar -cf web-dist.tar -C web dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web-dist.tar
          if-no-files-found: error
          retention-days: 1

  # The plugin components, signed packages, index and site rules: release-plugins.yml.
  plugins:
    permissions:
      contents: read
    uses: ./.github/workflows/release-plugins.yml
    secrets:
      RDOWNLOADER_PLUGIN_SIGNING_KEY: ${{ secrets.RDOWNLOADER_PLUGIN_SIGNING_KEY }}
      RDOWNLOADER_REPOSITORY_SIGNING_KEY: ${{ secrets.RDOWNLOADER_REPOSITORY_SIGNING_KEY }}

  # Compiles at once instead of waiting for `plugins` (RD-150-10): the packages come in only when
  # `packages` below lays them into the archives, so the two longest jobs run side by side.
  #
  # The two Linux legs are a job of their own, `binaries` below the other three, so `container`
  # waits for Linux alone and not for Windows and macOS (RD-150-10). Both jobs run the same steps,
  # written once here and taken over by the YAML anchor `binary-steps`.
  linux-binaries:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: rdownloader-linux-x86_64
          # Native arm runner, no emulation and no cross toolchain: the arm64 container image
          # copies this binary (RD-140-25), and the tarball ships like the x86_64 one. Same
          # Ubuntu release as above, so both Linux binaries share the glibc floor (2.39).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: rdownloader-linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps: &binary-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The `web` job's dist, which rust-embed compiles into the binary.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
      - name: Unpack the web interface
        shell: bash
        run: tar -xf web-dist.tar -C web && rm web-dist.tar
      # With RUSTUP_TOOLCHAIN set this is the toolchain cargo builds with, targets included; before
      # it, rust-toolchain.toml's was (then `stable`, now the pinned 1.99.0), and 1.5.0's release
      # failed on a target installed here but missing there ("can't find crate for `std`" for
      # x86_64-apple-darwin).
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      # The environment repro.yml rebuilds the Linux x86_64 binaries in, from the same script:
      # SOURCE_DATE_EPOCH and the stamp VERSION.txt and the About page carry from the tag's
      # commit instead of the clock — RD_VERSION, RD_BUILD_TIME, and RD_BUILD_COMMIT as
      # `Release-Build X.Y.Z (Basis <sha>)` through rd_build_stamp, which stops the build on a tag
      # that is not Cargo.toml's version (RD-180-05) — and on Linux the checkout, cargo and rustup
      # homes remapped through the target's own flags, never RUSTFLAGS, which would drop Windows'
      # `+crt-static` (docs/reproducible-builds.md).
      - name: Fix the build environment
        shell: bash
        run: scripts/release-build-env.sh --target ${{ matrix.target }} --release-tag "${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      # No Rust cache (RD-1120-07). The restore of `release-<target>` found nothing in six of six
      # legs of v1.11.0: a tag's run reads only its own caches and the default branch's, and no
      # workflow saves a release build on main — one per target would not fit the repository's
      # 10 GB beside the test caches. repro.yml builds without a cache, too.
      - run: cargo build --locked --release --target ${{ matrix.target }} -p rdownloader -p rd-capture
      - name: Write VERSION.txt
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: scripts/release-binary.sh version-file
      - name: Smoke-test Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/rdownloader.exe" --version
          & "target/${{ matrix.target }}/release/rdownloader-capture.exe" --version
      - name: Build macOS NZB helper app
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/release-binary.sh macos-helper
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        env:
          # No AppleDouble `._` entries from macOS's tar for the helper app's attributes.
          COPYFILE_DISABLE: "1"
        run: scripts/release-binary.sh package-unix "${{ matrix.target }}" "${{ matrix.artifact }}"
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/rdownloader.exe" stage/
          Copy-Item "target/${{ matrix.target }}/release/rdownloader-capture.exe" stage/
          Copy-Item scripts/windows/start-rdownloader.bat,scripts/windows/stop-rdownloader.bat,scripts/windows/start-capture.bat,scripts/windows/stop-capture.bat stage/
          Copy-Item LICENSE, README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "${{ matrix.artifact }}.unpacked.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpacked-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.unpacked.*
          if-no-files-found: error
          retention-days: 3

  binaries:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: rdownloader-windows-x86_64
          # Cross-compiled on the Apple Silicon runner (RD-150-10): Apple's toolchain builds
          # both architectures, and the Intel runner took 53 minutes for the same binary.
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: rdownloader-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: rdownloader-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps: *binary-steps

  # The signed plugin packages into every archive the two binary jobs made, under plugins/, without
  # repacking any other entry; then the layout check and the deb and rpm packages
  # (scripts/release-packages.sh).
  packages:
    needs: [plugins, linux-binaries, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # For the layout check and the deb/rpm configuration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugins
          path: layer/plugins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unpacked-*
          path: unpacked
          merge-multiple: true
      - name: Add the plugins to every archive
        shell: bash
        run: scripts/release-packages.sh add-plugins
      - name: Check the archive layout
        shell: bash
        run: scripts/release-packages.sh check-layout
      - name: Install nfpm
        shell: bash
        run: scripts/release-packages.sh install-nfpm
      - name: Build the deb and rpm packages
        shell: bash
        run: scripts/release-packages.sh deb-rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-installers
          path: installers/*
          if-no-files-found: error

  # RD-180-05: the Windows installer, from the finished zip, so it holds exactly its files. WiX
  # needs Windows; WiX 5 because 6 and later ask for their maintenance-fee EULA.
  msi:
    needs: packages
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: packages
      - name: Install WiX
        uses: ./.github/actions/install-wix
      - name: Unpack the release zip
        shell: pwsh
        run: Expand-Archive -Path packages/rdownloader-windows-x86_64.zip -DestinationPath stage
      # One per language of the interface (RD-1120-20); the English one keeps the plain name the
      # update manifest and the package channels read.
      - name: Build the MSIs
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-msi.sh stage installers/rdownloader-windows-x86_64.msi en
          for language in de es fr; do
            scripts/package-msi.sh stage "installers/rdownloader-windows-x86_64-${language}.msi" "${language}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-msi
          path: installers/*.msi
          if-no-files-found: error

  publish:
    needs: [extensions, plugins, packages, msi]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      # All tags: the update manifest's schema_change compares the migrations with the release
      # before this one (scripts/update-schema-change.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The packager builds the update manifest below and is not a release file (RD-180-01). It
      # is fetched by its own artifact name: out of the merged download below, any artifact that
      # carried a file named `rd-pack` could have become the program that writes the manifest
      # (security review 2026-09-30, finding 10).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packager
          path: ${{ runner.temp }}/packager
      - name: Set the packager aside
        run: |
          mv "${RUNNER_TEMP}/packager/rd-pack" "${RUNNER_TEMP}/rd-pack"
          chmod +x "${RUNNER_TEMP}/rd-pack"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      # The archives without their plugins are `packages`' input, not something to publish; the
      # packager came along with every other artifact and is not one either, nor a build record
      # of docker/build-push-action (switched off in the container jobs). The signed plugins go
      # to plugin-assets/, the plugin release's files.
      - name: Separate the plugins and drop the intermediate files
        run: scripts/release-assets.sh split release-assets plugin-assets
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/rdownloader.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # One SHA256SUMS per release, over its own files: `sha256sum --check` works on a full
      # download of either, and the update manifest and the package channels read the
      # application's.
      - name: Generate SHA-256 checksums
        run: scripts/release-assets.sh sums release-assets plugin-assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksum manifests with Sigstore
        shell: bash
        run: |
          for directory in release-assets plugin-assets; do
            (cd "${directory}" && cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --yes)
          done
      # RD-180-01: the signed update manifest of this release, from the SHA256SUMS above; signed
      # itself and therefore not in SHA256SUMS. Without the secret the release carries none.
      - name: Build and sign the update manifest
        env:
          RDOWNLOADER_UPDATE_SIGNING_KEY: ${{ secrets.RDOWNLOADER_UPDATE_SIGNING_KEY }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: scripts/release-publish.sh update-manifest
      # The plugin release first, so the index the application release brings never names a file
      # that is not there yet. Never `latest` — that stays the application release, where the
      # stable update manifest and the plugin index are found — and a pre-release with a beta.
      # The action creates the tag `plugins-vX.Y.Z` on this commit with the run's token, which
      # starts no workflow, and release.yml's tag pattern does not match it either.
      - name: Write the plugin release's text
        id: plugin-release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/release-publish.sh plugin-release
      - name: Publish the plugin release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.PLUGIN_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.plugin-release.outputs.name }}
          body_path: ${{ runner.temp }}/plugin-release.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          files: plugin-assets/*
      # A vX.Y.Z-beta.N tag is a pre-release: GitHub's `latest` then stays on the newest plain
      # release, which is where the stable update manifest and the plugin index are found.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*

  # The package managers, the apt and dnf repositories and the extension stores follow the release:
  # .github/workflows/release-channels.yml, with the secrets its three jobs read.
  channels:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/release-channels.yml
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      PACKAGES_DEPLOY_KEY: ${{ secrets.PACKAGES_DEPLOY_KEY }}
      PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

  # The arm64 image as `container` builds it, but natively on an arm runner and loaded instead of
  # pushed, through the same smoke test (RD-190-12): before it, the arm64 half of the published
  # image was built under QEMU and never started. The pushed image is built again by `container`
  # from the same Dockerfile, binary and plugins; what this proves is that they run on arm64.
  container-arm64:
    needs: [plugins, linux-binaries]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # docker/build-push-action uploads a build record as a workflow artifact by default, and
    # `publish` downloads every artifact of the run: v1.9.0 published it as a `.dockerbuild`
    # asset. The job summary stays.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugins
          path: dist/plugins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unpacked-rdownloader-linux-aarch64
          path: release-binaries
      - name: Lay out the arm64 binary for the build context
        shell: bash
        run: scripts/release-binary.sh docker-layout aarch64:arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the arm64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: prebuilt
          platforms: linux/arm64
          load: true
          tags: rdownloader:smoke
      - name: Smoke-test the arm64 image before anything is pushed
        run: scripts/docker-smoke.sh rdownloader:smoke

  # The image is built from the binaries above, not compiled again (owner, 2026-09-26): the arm64
  # half runs only apt, pip and the `--version` guard under QEMU. Nothing is pushed before the
  # amd64 image here and the arm64 image in `container-arm64` have passed the same smoke test as CI.
  #
  # It waits for `plugins` and the two Linux legs alone (RD-150-10), not for Windows and macOS: the
  # executable it copies is the one in the Linux archives, taken from them before `packages` adds
  # the plugins, which changes no other entry.
  container:
    needs: [plugins, linux-binaries, container-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No build record artifact, as in `container-arm64`.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    permissions:
      contents: read
      packages: write
      id-token: write
    # A re-run of a tag waits for the running one instead of racing it to the registry. Across
    # tags, `:latest` is held by the check below.
    concurrency:
      group: release-container-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugins
          path: dist/plugins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unpacked-rdownloader-linux-*
          path: release-binaries
          merge-multiple: true
      # From the tarballs, which keep the executable bit (scripts/release-binary.sh).
      - name: Lay out the Linux binaries for the build context
        shell: bash
        run: scripts/release-binary.sh docker-layout x86_64:amd64 aarch64:arm64
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: prebuilt
          platforms: linux/amd64
          load: true
          tags: rdownloader:smoke
      - name: Smoke-test the image before anything is pushed
        run: scripts/docker-smoke.sh rdownloader:smoke
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `:latest` only from the newest release tag, so a re-run of an old one cannot move it back.
      - name: Work out the image tags
        id: image
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/release-channels.sh image-tags
      - name: Build and publish multiarch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign multiarch image with Sigstore
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
