name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Read-only by default; the two jobs that publish name what they write (RD-140-25): `publish`
# the release and its keyless checksum signature, `container` the image and its signature.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Runner images are named rather than `-latest`, for the reason in ci.yml (RD-120-67): here the
# image also sets the glibc floor of the shipped Linux binary, which must not move by itself.

jobs:
  extensions:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: scripts/build-extension.sh
      # Mozilla signs the Firefox build as a self-distributed ("unlisted") version, so release
      # Firefox installs it permanently (RD-160-07). Without the secrets (a fork) or when AMO
      # cannot deliver, the step warns and the release keeps the unsigned ZIP; a version the
      # store already signed is downloaded rather than uploaded twice. scripts/firefox-amo.sh.
      - name: Sign the Firefox extension with Mozilla (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >-
          scripts/firefox-amo.sh sign artifacts/browser-extensions/firefox
          artifacts/browser-extensions/rdownloader-firefox.xpi
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extensions
          path: |
            artifacts/browser-extensions/*.zip
            artifacts/browser-extensions/*.xpi
          if-no-files-found: error

  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # No `web/dist` here any more: the packager is `rd-pack` (RD-150-20), which does not build
      # rd-api and its `#[derive(RustEmbed)]`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-plugins
      - run: cargo install cargo-component --version 0.21.1 --locked
      # For the import check scripts/build-plugins.sh runs on every component it builds, and the
      # one below over all of them.
      - uses: taiki-e/install-action@wasm-tools
      - name: Collect the bundled plugins
        id: plugins
        shell: bash
        run: |
          # Every plugins/ directory with a manifest.toml is a plugin and built here; xfs-common
          # has none because it is a shared library. Deriving the list means adding a plugin
          # is one directory, not five identical loops to keep in step.
          names=$(find plugins -mindepth 2 -maxdepth 2 -name manifest.toml -printf '%h\n' \
            | xargs -n1 basename | sort | tr '\n' ' ')
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "building: ${names}"
          # Building proves a plugin compiles; packaging additionally checks its
          # `min_app_version` against this build, and a plugin written for the release being
          # prepared cannot be packaged until the version bump. scripts/build-plugins.sh owns
          # that rule so it lives in one place and clears itself at the bump. It also leaves
          # out the examples (`plugins/example-*`), which are built but not bundled (RD-150-20).
          packageable=$(scripts/build-plugins.sh --list-packageable | sort | tr '\n' ' ')
          echo "packageable=${packageable}" >> "$GITHUB_OUTPUT"
          echo "packaging: ${packageable}"
      # Components are built only when their content changed (RD-150-10). The cache is the one
      # ci.yml's `components` job fills on `main` — a tag's run may read the default branch's
      # caches and nothing else — keyed by what goes into a component: toolchain, cargo-component,
      # the registry half of Cargo.lock and the root Cargo.toml (`deps`), and every plugin's source
      # hash (`sources`). A miss on `sources` restores the newest set with the same `deps`, and
      # build-plugins.sh rebuilds what its stamps call stale or missing. Every package is still
      # signed below, cached component or not.
      - name: Work out the component cache key
        id: component-key
        shell: bash
        run: scripts/build-plugins.sh --cache-key | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            target/wasm32-unknown-unknown/release/rd_plugin_*.wasm
            target/wasm32-unknown-unknown/release/rd_plugin_*.wasm.src-sha256
          key: components-1.98.0-cc0.21.1-${{ steps.component-key.outputs.deps }}-${{ steps.component-key.outputs.sources }}
          restore-keys: components-1.98.0-cc0.21.1-${{ steps.component-key.outputs.deps }}-
      - name: Build plugin components
        shell: bash
        run: scripts/build-plugins.sh --components-only
      - name: Reject accidental WASI capabilities
        shell: bash
        run: |
          components=()
          for plugin in ${{ steps.plugins.outputs.names }}; do
            components+=("target/wasm32-unknown-unknown/release/rd_plugin_${plugin//-/_}.wasm")
          done
          scripts/check-plugin-imports.sh "${components[@]}"
      # The packager, `rd-pack` (RD-150-20): the `plugin` and `site-rules` commands of
      # `rdownloader` without building the service. `release-test` because it compiles every
      # component with Wasmtime; `release`'s single code unit and LTO buy a tool nothing. The
      # packages it writes are the same bytes either way, and the embedded roots are the same.
      - name: Build the packager
        run: cargo build --locked --profile release-test -p rd-pack
      - name: Package and sign bundled plugins
        env:
          RDOWNLOADER_PLUGIN_SIGNING_KEY: ${{ secrets.RDOWNLOADER_PLUGIN_SIGNING_KEY }}
        shell: bash
        run: |
          mkdir -p dist/plugins dist/plugin-notes
          for plugin in ${{ steps.plugins.outputs.packageable }}; do
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "plugins/${plugin}/manifest.toml" | head -n 1)
            # RD-160-09: the CHANGELOG entries naming this version are its notes in the index.
            notes=$(scripts/plugin-release-notes.sh "${plugin}" "${version}")
            if [[ -n "${notes}" ]]; then
              printf '%s\n' "${notes}" > "dist/plugin-notes/${plugin}-${version}.txt"
            fi
            target/release-test/rd-pack plugin package \
              --manifest "plugins/${plugin}/manifest.toml" \
              --component "target/wasm32-unknown-unknown/release/rd_plugin_${plugin//-/_}.wasm" \
              --locales "plugins/${plugin}/locales" \
              --output "dist/plugins/${plugin}-${version}.rdplug"
            target/release-test/rd-pack plugin verify "dist/plugins/${plugin}-${version}.rdplug"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: dist/plugins/*.rdplug
          if-no-files-found: error
      # RD-140-01: the signed plugin repository index, over exactly the packages above. It names
      # each package by the digest of these bytes, so it can be built nowhere else. `verify`
      # checks it against the root this build embeds, which also catches a secret that is not
      # the repository key. Until the secret exists the release carries no index.
      - name: Build and sign the plugin index
        env:
          RDOWNLOADER_REPOSITORY_SIGNING_KEY: ${{ secrets.RDOWNLOADER_REPOSITORY_SIGNING_KEY }}
        shell: bash
        run: |
          if [[ -z "${RDOWNLOADER_REPOSITORY_SIGNING_KEY}" ]]; then
            echo "::warning::RDOWNLOADER_REPOSITORY_SIGNING_KEY is not set; this release publishes no plugin index"
            exit 0
          fi
          mkdir -p dist/plugin-index
          target/release-test/rd-pack plugin index build dist/plugins \
            --out dist/plugin-index/rdownloader-plugin-index.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --revocations crates/rd-plugin-host/resources/plugin-index-revocations.json \
            --notes dist/plugin-notes
          target/release-test/rd-pack plugin index verify \
            dist/plugin-index/rdownloader-plugin-index.json --packages dist/plugins
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-index
          path: dist/plugin-index/rdownloader-plugin-index.json
          if-no-files-found: ignore
      # RD-130-07: the site rules are not compiled in; every release carries them as a signed file
      # beside the packages. CI holds only the plugin key, so the file is signed locally with the
      # site-rules key and committed; this step proves the committed file verifies under this
      # build's root before `publish` attaches it.
      - name: Verify the site-rule file
        shell: bash
        run: |
          mkdir -p dist/site-rules
          cp crates/rd-siterules/resources/site-rules.json dist/site-rules/rdownloader-site-rules.json
          target/release-test/rd-pack site-rules verify dist/site-rules/rdownloader-site-rules.json
      - uses: actions/upload-artifact@v7
        with:
          name: site-rules
          path: dist/site-rules/rdownloader-site-rules.json
          if-no-files-found: error

  # Compiles at once instead of waiting for `plugins` (RD-150-10): the packages come in only when
  # `packages` below lays them into the archives, so the two longest jobs run side by side.
  #
  # The two Linux legs are a job of their own, `binaries` below the other three, so `container`
  # waits for Linux alone and not for Windows and macOS (RD-150-10). Both jobs run the same steps,
  # written once here and taken over by the YAML anchor `binary-steps`.
  linux-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: rdownloader-linux-x86_64
          # Native arm runner, no emulation and no cross toolchain: the arm64 container image
          # copies this binary (RD-140-25), and the tarball ships like the x86_64 one. Same
          # Ubuntu release as above, so both Linux binaries share the glibc floor (2.39).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: rdownloader-linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps: &binary-steps
      - uses: actions/checkout@v7
      # The version is the `packageManager` pin in web/package.json (RD-150-14).
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      # rust-toolchain.toml selects its own channel inside the checkout, so the target the step
      # above installed for 1.98.0 is not the one cargo builds with. The Intel macOS binary is
      # cross-built on the Apple Silicon runner since RD-150-10, and 1.5.0's release failed on
      # exactly this: "can't find crate for `std`" for x86_64-apple-darwin.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: pnpm --dir web install --frozen-lockfile
      # `run build` stopped type-checking in RD-120-25; named here so it still does.
      - run: pnpm --dir web run typecheck:full
      - run: pnpm --dir web run build
      - run: cargo build --locked --release --target ${{ matrix.target }} -p rdownloader -p rd-capture
      - run: mkdir stage
        shell: bash
      - name: Smoke-test Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/rdownloader.exe" --version
          & "target/${{ matrix.target }}/release/rdownloader-capture.exe" --version
      - name: Build macOS NZB helper app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          osacompile -o "stage/rDownloader Capture.app" resources/macos/rdownloader-capture.applescript
          cp resources/macos/capture-helper-Info.plist "stage/rDownloader Capture.app/Contents/Info.plist"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version}" "stage/rDownloader Capture.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${version}" "stage/rDownloader Capture.app/Contents/Info.plist"
          plutil -lint "stage/rDownloader Capture.app/Contents/Info.plist"
          codesign --force --deep --sign - "stage/rDownloader Capture.app"
      # Everything but the plugins, which `packages` adds: an uncompressed tar, so the executable
      # bits survive the artifact store and the entries stay the ones made here.
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        env:
          # No AppleDouble `._` entries from macOS's tar for the helper app's attributes.
          COPYFILE_DISABLE: "1"
        run: |
          cp "target/${{ matrix.target }}/release/rdownloader" stage/
          cp "target/${{ matrix.target }}/release/rdownloader-capture" stage/
          cp LICENSE README.md stage/
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cp scripts/linux/start-rdownloader.sh scripts/linux/stop-rdownloader.sh \
              scripts/linux/start-capture.sh scripts/linux/stop-capture.sh stage/
          else
            cp scripts/macos/start-rdownloader.command scripts/macos/stop-rdownloader.command \
              scripts/macos/start-capture.command scripts/macos/stop-capture.command stage/
          fi
          chmod +x stage/start-rdownloader.* stage/stop-rdownloader.* stage/start-capture.* stage/stop-capture.*
          tar --directory stage --create --file "${{ matrix.artifact }}.unpacked.tar" .
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/rdownloader.exe" stage/
          Copy-Item "target/${{ matrix.target }}/release/rdownloader-capture.exe" stage/
          Copy-Item scripts/windows/start-rdownloader.bat,scripts/windows/stop-rdownloader.bat,scripts/windows/start-capture.bat,scripts/windows/stop-capture.bat stage/
          Copy-Item LICENSE, README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "${{ matrix.artifact }}.unpacked.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: unpacked-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.unpacked.*
          if-no-files-found: error
          retention-days: 3

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: rdownloader-windows-x86_64
          # Cross-compiled on the Apple Silicon runner (RD-150-10): Apple's toolchain builds
          # both architectures, and the Intel runner took 53 minutes for the same binary.
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: rdownloader-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: rdownloader-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps: *binary-steps

  # The signed plugin packages into every archive the two binary jobs made, under plugins/ as before: the
  # tar gets them appended and is compressed, the zip gets them added. Nothing is extracted and
  # repacked, so every other entry is byte for byte the one the platform's runner wrote.
  packages:
    needs: [plugins, linux-binaries, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugins
          path: layer/plugins
      - uses: actions/download-artifact@v8
        with:
          pattern: unpacked-*
          path: unpacked
          merge-multiple: true
      - name: Add the plugins to every archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          count=0
          for archive in unpacked/*.unpacked.tar unpacked/*.unpacked.zip; do
            [[ -f "${archive}" ]] || continue
            name="$(basename "${archive}")"
            case "${name}" in
              *.tar)
                tar --directory layer --append --file "${archive}" ./plugins
                gzip --no-name --stdout "${archive}" > "packages/${name%.unpacked.tar}.tar.gz"
                ;;
              *.zip)
                cp "${archive}" "packages/${name%.unpacked.zip}.zip"
                (cd layer && zip -q -r "../packages/${name%.unpacked.zip}.zip" plugins)
                ;;
            esac
            count=$((count + 1))
          done
          # One archive per binary target; fewer means a platform is missing from the release.
          [[ ${count} -eq 5 ]] || { echo "::error::expected 5 archives, found ${count}"; exit 1; }
          ls -l packages
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: packages/*
          if-no-files-found: error

  publish:
    needs: [extensions, plugins, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      # The archives without their plugins are `packages`' input, not something to publish.
      - name: Drop the intermediate archives
        run: rm -f release-assets/*.unpacked.*
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/rdownloader.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        shell: bash
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | sort --zero-terminated \
            | xargs --null sha256sum > SHA256SUMS
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign checksum manifest with Sigstore
        working-directory: release-assets
        run: cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --yes
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*

  # RD-180-06: the Homebrew tap and the Scoop bucket follow the release — the formula and the
  # manifest rendered by scripts/package-managers.sh from the published SHA256SUMS, each with its
  # repository's README, pushed to <owner>/homebrew-rdownloader and <owner>/scoop-rdownloader.
  # Each repository has a write deploy key of its own, whose private half is a secret here
  # (HOMEBREW_TAP_DEPLOY_KEY, SCOOP_BUCKET_DEPLOY_KEY); actions/checkout clones with it and leaves
  # the SSH remote for the push, so each channel pushes with its own key only. A channel whose
  # secret is missing (a fork) is skipped with a warning, the other still runs. The release is out
  # by then, so nothing here may fail it: the job continues on error, and the bucket is still
  # pushed when the tap failed. Only the newest plain vX.Y.Z tag is pushed, as with the image's
  # `:latest`, so a re-run of an old tag or a pre-release cannot move the channels back.
  package-managers:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # A secret cannot be tested in `if:`, so this step says which channels have their key.
      - name: Decide whether the tap and the bucket move
        id: gate
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          newest="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -n 1)"
          if [[ "${REF_NAME}" != "${newest}" ]]; then
            echo "::notice::${REF_NAME} is not the newest release tag (${newest:-none}); the tap and the bucket stay where they are"
            echo "tap=false" >> "${GITHUB_OUTPUT}"
            echo "bucket=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          for channel in tap:HOMEBREW_TAP_DEPLOY_KEY bucket:SCOOP_BUCKET_DEPLOY_KEY; do
            name="${channel%%:*}"
            secret="${channel#*:}"
            if [[ -z "${!secret}" ]]; then
              echo "::warning::${secret} is not set; the ${name} stays on its last release"
              echo "${name}=false" >> "${GITHUB_OUTPUT}"
            else
              echo "${name}=true" >> "${GITHUB_OUTPUT}"
            fi
          done
      - name: Render the formula, the manifest and their READMEs
        id: render
        if: steps.gate.outputs.tap == 'true' || steps.gate.outputs.bucket == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release download "${REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir release
          scripts/package-managers.sh "${REF_NAME}" release/SHA256SUMS rendered --repository "${GITHUB_REPOSITORY}"
      - uses: actions/checkout@v7
        if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.gate.outputs.tap == 'true' }}
        with:
          repository: ${{ github.repository_owner }}/homebrew-rdownloader
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Push the formula to the Homebrew tap
        if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.gate.outputs.tap == 'true' }}
        shell: bash
        env:
          CHECKOUT: tap
          RENDERED: rendered/rdownloader.rb
          TARGET: Formula/rdownloader.rb
          README: rendered/homebrew-README.md
          REF_NAME: ${{ github.ref_name }}
        # The key stays where actions/checkout put it, in that checkout's SSH configuration;
        # nothing here reads or prints it.
        run: &push-channel |
          set -euo pipefail
          mkdir -p "$(dirname "${CHECKOUT}/${TARGET}")"
          cp "${RENDERED}" "${CHECKOUT}/${TARGET}"
          cp "${README}" "${CHECKOUT}/README.md"
          git -C "${CHECKOUT}" config user.name "github-actions[bot]"
          git -C "${CHECKOUT}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${CHECKOUT}" add --all
          if git -C "${CHECKOUT}" diff --cached --quiet; then
            echo "${CHECKOUT}: already at ${REF_NAME}"
            exit 0
          fi
          git -C "${CHECKOUT}" commit --quiet --message "rdownloader ${REF_NAME#v}"
          git -C "${CHECKOUT}" push --quiet origin HEAD
          echo "${CHECKOUT}: rdownloader ${REF_NAME#v}"
      - uses: actions/checkout@v7
        if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.gate.outputs.bucket == 'true' }}
        with:
          repository: ${{ github.repository_owner }}/scoop-rdownloader
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          path: bucket
      - name: Push the manifest to the Scoop bucket
        if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.gate.outputs.bucket == 'true' }}
        shell: bash
        env:
          CHECKOUT: bucket
          RENDERED: rendered/rdownloader.json
          TARGET: bucket/rdownloader.json
          README: rendered/scoop-README.md
          REF_NAME: ${{ github.ref_name }}
        run: *push-channel

  # The image is built from the binaries above, not compiled again (owner, 2026-09-26): the arm64
  # half runs only apt, pip and the `--version` guard under QEMU. Nothing is pushed before the
  # amd64 image has passed the same smoke test as CI.
  #
  # It waits for `plugins` and the two Linux legs alone (RD-150-10), not for Windows and macOS: the
  # executable it copies is the one in the Linux archives, taken from them before `packages` adds
  # the plugins, which changes no other entry.
  container:
    needs: [plugins, linux-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    # A re-run of a tag waits for the running one instead of racing it to the registry. Across
    # tags, `:latest` is held by the check below.
    concurrency:
      group: release-container-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plugins
          path: dist/plugins
      - uses: actions/download-artifact@v8
        with:
          pattern: unpacked-rdownloader-linux-*
          path: release-binaries
          merge-multiple: true
      # docker/Dockerfile's `prebuilt` target reads dist/docker/linux-$TARGETARCH/rdownloader.
      # From the tarballs rather than loose files: upload-artifact drops the executable bit, tar
      # keeps it, and the image then carries exactly the binary the release ships.
      - name: Lay out the Linux binaries for the build context
        shell: bash
        run: |
          for pair in x86_64:amd64 aarch64:arm64; do
            arch="${pair%%:*}"
            docker_arch="${pair##*:}"
            mkdir -p "dist/docker/linux-${docker_arch}"
            tar --extract --file "release-binaries/rdownloader-linux-${arch}.unpacked.tar" \
              --directory "dist/docker/linux-${docker_arch}" ./rdownloader
            file "dist/docker/linux-${docker_arch}/rdownloader"
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: prebuilt
          platforms: linux/amd64
          load: true
          tags: rdownloader:smoke
      - name: Smoke-test the image before anything is pushed
        run: scripts/docker-smoke.sh rdownloader:smoke
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `:latest` only from the newest release tag, so a re-run of an old one cannot move it back.
      # Only plain vX.Y.Z tags count, and sort -V orders v1.10.0 after v1.9.0.
      - name: Work out the image tags
        id: image
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          newest="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -n 1)"
          tags="${name}:${REF_NAME}"
          if [[ "${REF_NAME}" == "${newest}" ]]; then
            tags+=$'\n'"${name}:latest"
          else
            echo "::notice::${REF_NAME} is not the newest release tag (${newest:-none}); :latest stays where it is"
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          printf 'tags<<EOF\n%s\nEOF\n' "${tags}" >> "${GITHUB_OUTPUT}"
          printf 'pushing:\n%s\n' "${tags}"
      - name: Build and publish multiarch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign multiarch image with Sigstore
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
