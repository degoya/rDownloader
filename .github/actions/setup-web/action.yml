name: Set up Node and pnpm
description: >
  Node 24 and, unless `pnpm` is false, pnpm in the version web/package.json pins
  (`packageManager`, RD-150-14) with its store cached by web/pnpm-lock.yaml (RD-191-09: the pair
  stood in nine jobs). Node's major moves here and in docs/development.md together.
inputs:
  pnpm:
    description: "false: Node alone, for a job that runs node scripts but installs nothing in web/"
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.pnpm == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: web/package.json
    - if: inputs.pnpm == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - if: inputs.pnpm != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
