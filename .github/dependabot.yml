# Update proposals for the public repository (RD-140-25).
#
# The public repository is an export, refreshed at every release as one fresh commit, so a
# Dependabot pull request is never merged there: like every pull request it is a proposal the
# maintainer applies by hand in the development repository (CONTRIBUTING.md), and its CI run is
# what says whether the update is safe to apply. Hence few, grouped pull requests on a slow
# schedule rather than one per crate. Security updates for alerts are switched on in the
# repository's settings, not here; the `security` groups only bundle what they open.
version: 2
updates:
  # The actions' versions: few, small, and each one a line to copy. Every action is pinned to a
  # commit with its release as a comment (scripts/check-actions-pinned.sh); Dependabot moves both.
  # The composite actions under .github/actions/ pin actions of their own (setup-rust, setup-web,
  # RD-191-09), so their directories are read beside the workflows'.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The container image's base images (RD-191-09): docker/Dockerfile pins each by tag and by the
  # digest of its multi-platform index, and this moves the digest when the tag is rebuilt. The tags
  # themselves stay: Rust follows the toolchain pin (rust-toolchain.toml, RUSTUP_TOOLCHAIN in the
  # workflows) and Node the major we build with (24); `debian:trixie-slim` sets the glibc floor of
  # the prebuilt binary and moves only by hand (the comment in the Dockerfile). The Python tools in
  # the image move with `scripts/docker-tools.sh --bump`, not here.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]

  # One pull request for everything semver-compatible and one for the major versions: a major
  # update is work of its own and becomes a job, while the compatible group is a
  # `cargo update` away and says which crates moved.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # wasmparser follows wasmtime: the version wasmtime itself pulls in is the one we pin, so the
    # build carries one wasmparser, not two (RD-150-21). It moves when wasmtime moves.
    ignore:
      - dependency-name: wasmparser
    groups:
      cargo-compatible:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # web/ only: extension/package.json declares no dependencies. `npm` is also the ecosystem for
  # a pnpm project: Dependabot reads web/pnpm-lock.yaml and updates it with pnpm (RD-150-14).
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # `openapi-typescript` (the schema generator) requires TypeScript 5; a TypeScript major in
    # the group fails the install and hides every other update's result (RD-150-06).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Node types follow the Node major we build and ship with (24); a newer major would
      # offer APIs the runtime does not have (RD-160-08).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # VueUse follows Nuxt UI's own requirement; a newer major alone would ship two copies
      # (RD-150-21, RD-160-08).
      - dependency-name: "@vueuse/core"
        update-types: ["version-update:semver-major"]
    groups:
      npm-compatible:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
