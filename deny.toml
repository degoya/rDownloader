  { crate = "rand:0.8", reason = "crypto-glue 0.1, num-bigint-dig (webauthn-rs)" },
  { crate = "rand_chacha:0.3", reason = "crypto-glue 0.1 via rand 0.8 (webauthn-rs)" },
  { crate = "rfc6979:0.4", reason = "crypto-glue 0.1 via ecdsa 0.16 (webauthn-rs)" },
  { crate = "rsa:0.9", reason = "crypto-glue 0.1 (webauthn-rs)" },
  { crate = "salsa20:0.10", reason = "crypto-glue 0.1 via scrypt 0.11 (webauthn-rs)" },
