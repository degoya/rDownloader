  { crate = "universal-hash:0.5", reason = "crypto-glue 0.1 via polyval 0.6 (webauthn-rs)" },

  # The same RustCrypto generation, also held by wasmtime 49 / cranelift 0.136 (sha2 0.10),
  # sqlx 0.9 (sqlx-core: sha2 0.10) and object_store 0.14 (crc-fast: digest 0.10) besides
