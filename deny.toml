[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "warn"
ignore = [
  # ringbuf 0.4.8 (RUSTSEC-2026-0293): `Consumer::skip`/`clear` double-drop an element whose
  # own `Drop` panics. Reached only through librqbit-utp 0.7.0 (the latest), whose one ring
  # buffer is `SharedRb<Heap<u8>>` (stream_tx.rs:129): `u8` has no `Drop`, so the path cannot
  # be taken. Remove once librqbit-utp moves to ringbuf >= 0.5.2.
  { id = "RUSTSEC-2026-0293", reason = "ringbuf only via librqbit-utp with u8 elements, which have no Drop; no patched librqbit-utp exists." },
  # Marvin attack: a timing sidechannel in RSA *private key* operations; no rsa release is
  # patched (0.9.10 and 0.10.0-rc.18 are both covered). rsa 0.9.10 comes from openidconnect
  # (RD-190-15), which only *verifies* RS256/PS256
  # signatures of attestations and ID tokens — public key operations. russh's default `rsa`
  # feature pulls in rsa 0.10.0-rc.18: verifying an SSH host key is a public key operation as
  # well, and the only private key operation here is signing once per connection with a
  # deliberately configured RSA client key, which gives an observer far too few samples to be
  # useful. Disabling that feature removes the advisory but also drops ssh-rsa and rsa-sha2-*
  # host keys, which are still common on default sshd installations, so the compatibility cost
  # outweighs the exposure. Review this entry on every release, and drop it once rsa 0.10 is
  # stable and openidconnect and russh have moved to it (`cargo update`). Settings > FTP, SFTP
  # and WebDAV recommends Ed25519 client keys, which need no RSA private key operation at all.
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 via openidconnect, rsa 0.10 rc via russh; Marvin targets private-key operations, which signature, host key and ID-token verification do not perform. No safe upgrade is available." },

  # proc-macro-error below, under the archived GTK3 bindings, is a graph artifact rather than a
  # real dependency: nothing here ever compiles it. (The nine GTK3 advisories themselves no
  # longer match since tray-icon 0.26 / muda 0.21 and were dropped with RD-1100-11.) rd-capture
  # gates tao/tray-icon to `cfg(any(windows, target_os = "macos"))` because Linux stays
  # headless, and GTK is in turn a Linux-only dependency of those two — a combination no
  # single target produces. They only surface because `graph.targets` lists three targets
  # and cargo-deny filters the graph edge by edge instead of path by path. Confirm with
  # `cargo deny --target x86_64-unknown-linux-gnu check advisories`, which reports none of
  # it. Drop it once tao and tray-icon move off GTK3.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros and gtk3-macros; unreachable GTK3 stack, see above." },
  # glib 0.18.5 (RUSTSEC-2024-0429, informational "unsound" in `VariantStrIter`) belongs to the
  # same GTK3 stack: a Linux-only dependency of tao and tray-icon, which rd-capture builds on
  # Windows and macOS only, so no shipped binary contains it, and nothing here iterates a
  # GVariant. cargo-deny does not report it for that reason; cargo audit, which does not
  # filter by target, does. Drop it together with RUSTSEC-2024-0370.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 via the GTK3 stack of tao and tray-icon, built for no shipped target; see above." },

  # zbus_names, zvariant and zvariant_derive are unmaintained as standalone crates: zbus 6.0.0
  # (2026-10-16) took them in as modules. They come from zbus 5, which notify-rust 4.18.2 and
  # secret-service 5.2.0, both the latest, still require (`zbus = "^5"`); no advisory names a
  # flaw in them. Drop all three once both move to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5, required by the latest notify-rust and secret-service; merged into zbus 6, no flaw reported." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5, required by the latest notify-rust and secret-service; merged into zbus 6, no flaw reported." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5, required by the latest notify-rust and secret-service; merged into zbus 6, no flaw reported." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  # Public-domain-equivalent, reached through quoted_printable via lettre.
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  # Permissive data licence covering the Mozilla CA bundle shipped by webpki-roots.
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# A second version of a crate is an error (RD-150-21): every older version below is held back by
# a dependency we cannot move ourselves, and its entry names that dependency. The list only
# shrinks — CI runs `cargo deny check` with `-D unmatched-skip -D unnecessary-skip`, so an entry
# whose upstream moved on fails until it is deleted. A new duplicate is fixed (`cargo update -p`,
# a version the upstream already uses) before it earns an entry here. Versions are caret
# requirements so a patch release of the held-back line needs no edit. Dev-dependencies do not
# count (`multiple-versions-include-dev` is off); build scripts and proc macros do.
multiple-versions = "deny"
wildcards = "allow"
skip = [
  # The previous RustCrypto generation (digest 0.10, rsa 0.9, rand 0.8). webauthn-rs 0.6.2 moved
  # to crypto-glue 0.2 (2026-11-01) and took about 35 duplicates with it; what stays is held by
  # openidconnect 4.1 and its oauth2 5 (rd-authn, RD-190-15), argon2 0.5 inside crypto-glue 0.2,
  # and webauthn-rs-core's own base64 0.21 and nom 7.
  { crate = "argon2:0.5", reason = "crypto-glue 0.2 (webauthn-rs)" },
  { crate = "base64:0.21", reason = "webauthn-rs-core and webauthn-rs-proto 0.6.2" },
  { crate = "blake2:0.10", reason = "argon2 0.5 (crypto-glue 0.2, webauthn-rs)" },
  { crate = "der:0.7", reason = "pkcs1 0.7, pkcs8 0.10, spki 0.7 via rsa 0.9 (openidconnect)" },
  { crate = "hmac:0.12", reason = "openidconnect 4.1" },
  { crate = "nom:7", reason = "webauthn-rs-core, x509-parser, der-parser, asn1-rs (webauthn-rs)" },
  { crate = "num-bigint:0.4", reason = "der-parser (webauthn-rs); num 0.4 (secret-service via keyring)" },
  { crate = "password-hash:0.5", reason = "argon2 0.5 (crypto-glue 0.2, webauthn-rs)" },
  { crate = "pem-rfc7468:0.7", reason = "der 0.7 via rsa 0.9 (openidconnect)" },
  { crate = "pkcs1:0.7", reason = "rsa 0.9 (openidconnect)" },
  { crate = "pkcs8:0.10", reason = "rsa 0.9 (openidconnect)" },
  { crate = "rand:0.8", reason = "openidconnect 4.1, oauth2 5, num-bigint-dig" },
  { crate = "rand_chacha:0.3", reason = "rand 0.8 (openidconnect, oauth2)" },
  { crate = "rsa:0.9", reason = "openidconnect 4.1" },
  { crate = "signature:2", reason = "rsa 0.9 (openidconnect)" },
  { crate = "spki:0.7", reason = "rsa 0.9 (openidconnect)" },

  # The same generation, also held by wasmtime 50 / cranelift 0.137 (sha2 0.10), sqlx 0.9
  # (sqlx-core: sha2 0.10) and object_store 0.14 (crc-fast: digest 0.10).
  { crate = "block-buffer:0.10", reason = "digest 0.10: openidconnect, wasmtime, cranelift, sqlx-core, crc-fast (object_store)" },
  { crate = "const-oid:0.9", reason = "digest 0.10, der 0.7, rsa 0.9 (openidconnect)" },
  { crate = "cpufeatures:0.2", reason = "sha2 0.10: wasmtime, cranelift, sqlx-core, openidconnect; argon2 0.5" },
  { crate = "crypto-common:0.1", reason = "digest 0.10: openidconnect, wasmtime, cranelift, sqlx-core, crc-fast (object_store)" },
  { crate = "digest:0.10", reason = "openidconnect (hmac, rsa, sha2), wasmtime, cranelift, sqlx-core, crc-fast (object_store), blake2" },
  { crate = "generic-array:0.14", reason = "digest 0.10 users as above; generic-array 1 (russh) re-exports it" },
  { crate = "rand_core:0.6", reason = "rand 0.8 and rsa 0.9 (openidconnect), password-hash 0.5" },
  { crate = "sha2:0.10", reason = "openidconnect, oauth2, wasmtime-environ, wasmtime-internal-cache, cranelift-codegen, sqlx-core" },
  { crate = "base64:0.22", reason = "hyper-util 0.1 (axum, reqwest), sqlx-core, wasmtime-internal-cache" },
  { crate = "getrandom:0.2", reason = "rand_core 0.6 (as above), oauth2 5, ring 0.17, redox_users" },

  # rand 0.9 line: governor 0.10 (rd-limits), librqbit-utp 0.7 (librqbit); webauthn-rs-core 0.6.2
  # is on rand_chacha 0.10.
  { crate = "rand:0.9", reason = "governor 0.10, librqbit-utp 0.7, webauthn-rs-core" },
  { crate = "rand_core:0.9", reason = "rand 0.9: governor 0.10, librqbit-utp 0.7, webauthn-rs-core" },
  { crate = "getrandom:0.3", reason = "rand_core 0.9: governor 0.10, librqbit-utp 0.7, webauthn-rs-core" },
  { crate = "rand_chacha:0.9", reason = "rand 0.9: governor 0.10, librqbit-utp 0.7" },

  # librqbit 9.0.1 (rd-torrent).
  { crate = "generic-array:0.12", reason = "size_format 1.0 (librqbit)" },
  { crate = "num:0.2", reason = "size_format 1.0 (librqbit)" },
  { crate = "num-complex:0.2", reason = "size_format 1.0 via num 0.2 (librqbit)" },
  { crate = "num-rational:0.2", reason = "size_format 1.0 via num 0.2 (librqbit)" },
  { crate = "nix:0.30", reason = "librqbit 9.0.1" },
  { crate = "quick-xml:0.41", reason = "librqbit-upnp 9.0.1, object_store 0.14, wayland-scanner (arboard)" },
  { crate = "thiserror:1", reason = "tokio-socks 0.5 (librqbit), webauthn-rs-core, asn1-rs, x509-parser, jni 0.21 (tao), glib 0.18, redox_users 0.4 (wasmtime cache)" },
  { crate = "thiserror-impl:1", reason = "thiserror 1, as above" },

  # sqlx 0.9 (rd-db).
  { crate = "atoi:2", reason = "sqlx-sqlite and sqlx-postgres 0.9" },
  { crate = "spin:0.9", reason = "flume 0.12 (sqlx-sqlite), multer 3 (axum), lazy_static 1.5" },

  # hashbrown: every line has its own holder.
  { crate = "hashbrown:0.14", reason = "dashmap 6 (governor, boa_engine, russh-sftp)" },
  { crate = "hashbrown:0.15", reason = "petgraph 0.8 via tree_magic_mini, wl-clipboard-rs (arboard)" },
  { crate = "foldhash:0.1", reason = "hashbrown 0.15 via petgraph 0.8 (arboard)" },
  { crate = "hashbrown:0.16", reason = "gimli 0.33 (wasmtime), sqlx-core and hashlink 0.11 (sqlx), governor 0.10" },

  # wasmtime 50 / cranelift 0.137 (rd-plugin-host).
  { crate = "itertools:0.14", reason = "wasmtime-internal-cranelift 50, openidconnect 4.1" },
  # The wasm-tools line: wasmtime 50.0.1, the newest release (2026-10-29), is on 0.261, the
  # wit-bindgen 0.63 proc macro the plugin crates compile with on 0.262 (RD-160-08). The service
  # ships 0.261 only; 0.262 lives in the plugins' build. They leave when a wasmtime release moves
  # to 0.262.
  { crate = "wasmparser:0.261", reason = "wasmtime 50 (rd-plugin-host); wit-bindgen 0.63 uses 0.262" },
  { crate = "wasm-encoder:0.261", reason = "wasmtime-environ 50; wit-bindgen 0.63 uses 0.262" },
  { crate = "wasm-metadata:0.261", reason = "wit-component 0.261 (wasmtime 50); wit-bindgen 0.63 uses 0.262" },
  { crate = "wit-component:0.261", reason = "wasmtime-internal-wit-bindgen 50; wit-bindgen 0.63 uses 0.262" },
  { crate = "wit-parser:0.261", reason = "wasmtime-internal-wit-bindgen and -component-macro 50; wit-bindgen 0.63 uses 0.262" },

  # croner 4 (rd-subscription).
  { crate = "darling:0.20", reason = "derive_builder_core 0.20 (croner 4)" },
  { crate = "darling_core:0.20", reason = "derive_builder_core 0.20 (croner 4)" },
  { crate = "darling_macro:0.20", reason = "derive_builder_core 0.20 (croner 4)" },
  { crate = "strum:0.27", reason = "croner 4" },
  { crate = "strum_macros:0.27", reason = "croner 4 via strum 0.27" },

  # chrono-tz 0.10 (rd-api, rd-limits, rd-power, rd-scheduler, rd-stream).
  { crate = "phf:0.12", reason = "chrono-tz 0.10" },
  { crate = "phf_shared:0.12", reason = "chrono-tz 0.10 via phf 0.12" },

  # tao 0.37 / tray-icon 0.25 / muda (rd-capture). The GTK3 stack is a Linux dependency of
  # crates rd-capture only builds on Windows and macOS (see the advisories above): graph artefacts,
  # compiled for no target we ship.
  { crate = "heck:0.4", reason = "glib-macros 0.18 (GTK3 via tao, tray-icon)" },
  { crate = "proc-macro-crate:1", reason = "gtk3-macros 0.18 (GTK3 via tao, tray-icon)" },
  { crate = "proc-macro-crate:2", reason = "glib-macros 0.18 (GTK3 via tao, tray-icon)" },
  { crate = "serde_spanned:0.6", reason = "system-deps 6, glib-macros 0.18 (GTK3 via tao, tray-icon)" },
  { crate = "syn:1", reason = "proc-macro-error 1 (GTK3 via tao, tray-icon)" },
  { crate = "target-lexicon:0.12", reason = "cfg-expr 0.15 via system-deps 6 (GTK3 via tao, tray-icon)" },
  { crate = "toml:0.8", reason = "system-deps 6 (GTK3 via tao, tray-icon)" },
  { crate = "toml_datetime:0.6", reason = "system-deps 6, glib-macros, gtk3-macros 0.18 (GTK3 via tao, tray-icon)" },
  { crate = "toml_edit:0.19", reason = "gtk3-macros 0.18 via proc-macro-crate 1 (GTK3 via tao, tray-icon)" },
  { crate = "toml_edit:0.20", reason = "glib-macros 0.18, system-deps 6 (GTK3 via tao, tray-icon)" },
  { crate = "winnow:0.5", reason = "toml_edit 0.19/0.20 (GTK3 via tao, tray-icon)" },
  { crate = "miniz_oxide:0.8", reason = "png 0.18 (muda via tray-icon, rd-capture's tray icon); flate2 uses 0.9" },

  # windows-sys: one line per holder.
  { crate = "windows-sys:0.52", reason = "ring 0.17 (rustls-webpki, quinn-proto), dontfrag 1 (librqbit-utp)" },
  { crate = "windows-sys:0.59", reason = "global-hotkey 0.9 (rd-capture)" },

  # One holder each.
  { crate = "untrusted:0.7", reason = "aws-lc-rs 1.18 (object_store, librqbit-sha1-wrapper); ring uses 0.9" },
  { crate = "tower-http:0.6", reason = "reqwest 0.13" },
  { crate = "syn:2", reason = "about 55 proc macros are still on syn 2 (tracing-attributes, pin-project-internal, zerocopy-derive, sqlx-macros, wasmtime-internal-component-macro, …)" },
  { crate = "synstructure:0.13", reason = "yoke-derive, zerofrom-derive (url via icu), asn1-rs-derive (webauthn-rs)" },
]

