  { crate = "nom:7", reason = "webauthn-rs-core, x509-parser, der-parser, asn1-rs (webauthn-rs)" },
  { crate = "num-bigint:0.4", reason = "der-parser (webauthn-rs); num 0.4 (secret-service via keyring)" },
  { crate = "p256:0.13", reason = "crypto-glue 0.1 (webauthn-rs)" },
  { crate = "p384:0.13", reason = "crypto-glue 0.1 (webauthn-rs)" },
  { crate = "p521:0.13", reason = "crypto-glue 0.1 (webauthn-rs)" },
  { crate = "password-hash:0.5", reason = "crypto-glue 0.1 via argon2 0.5 (webauthn-rs)" },
  { crate = "pbkdf2:0.12", reason = "crypto-glue 0.1 (webauthn-rs)" },
  { crate = "pem-rfc7468:0.7", reason = "crypto-glue 0.1, x509-cert 0.2 (webauthn-rs)" },
