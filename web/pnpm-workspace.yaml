# A flat node_modules, as npm laid it out. Isolated (pnpm's default) resolves every package
# through node_modules/.pnpm/<name>@<version>_<peer hash>/, and the Nuxt UI resolver writes that
# real path into the tracked web/components.d.ts and web/auto-imports.d.ts, so each dependency
# update and each machine would rewrite them. The packages still come from pnpm's store as
# hard links; what is given up is only the strict check for undeclared imports, which passed
# once on 2026-09-27 (RD-150-14: vue-tsc, Vitest and the build under isolated).
nodeLinker: hoisted

# pnpm runs no dependency's install script unless it is named here (true runs it, false
# silences the warning). esbuild's swaps its JS shim for the native binary; vue-demi's only
# picks between Vue 2 and 3, and the default is already 3. Same choice as the website.
allowBuilds:
  esbuild: true
  vue-demi: false

# glob up to 14.0.1 keeps walking the tree after its AbortSignal fired (GHSA-3g3m-2fjr-6pw4). It
# is a development dependency only: js-beautify 2.0.3, under @vue/test-utils, asks for ^13 and
# uses it in its command line, which the tests never start. Drop the override once js-beautify
# moves to glob 14.
#
# minimatch below 11.0.1 amplifies brace patterns into a denial of service (GHSA-g3hv-75wg-m249).
# Development dependency only: editorconfig 3.0.2, under js-beautify 2.0.3, asks for ^10; its two
# calls (Minimatch, escape) are unchanged in 11, and editorconfig 4 takes ~11.0.5 itself. Drop the
# override once js-beautify moves to editorconfig 4.
overrides:
  glob: ^14.0.2
  editorconfig>minimatch: ^11.0.5
  # @vue/test-utils 2.6.0 (via @testing-library/vue) no longer writes a click through to the
  # plain model object four component tests hand in; held on 2.5.1 until RD-1450-04 moves the
  # tests to 2.6 (2026-11-21).
  '@vue/test-utils': 2.5.1

# Nuxt UI 4.13.0 is younger than pnpm's minimum release age; the owner took it on 2026-11-19.
# Remove the entry once the version is older than the age.
minimumReleaseAgeExclude:
  - '@nuxt/ui@4.13.0'
