[workspace.package]
version = "1.19.0"
authors = ["Alexander Herling"]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/degoya/rDownloader"

[workspace.dependencies]
aes = "0.9"
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
argon2 = "0.6"
async-trait = "0.1"
# The stand-in identity provider's signing keys in the tests (`rd_authn::oidc_testing`, RD-190-15):
# the crypto provider rustls, russh and the object store already link.
aws-lc-rs = "1.18"
axum = { version = "0.8", features = ["http1", "json", "macros", "multipart", "tokio"] }
base64 = "0.23"
boa_engine = { version = "0.22", default-features = false, features = ["fuzz"] }
bytes = "1"
cbc = "0.2"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
# Cron expressions for scheduled subscriptions (RD-130-19): POSIX weekdays and five-field
# patterns, which is what people copy out of a crontab.
croner = "4"
ctr = "0.10"
dunce = "1"
directories = "6"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8"] }
embed-resource = "3.0.11"
# Gzip for the portable archive the self-update unpacks (RD-180-02); `zip` pulls it in already.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
# Free and total space of a volume; the maintained fork of `fs2`, same functions.
fs4 = { version = "1.1", default-features = false }
# System-wide shortcuts for the capture agent's tray commands (RD-1180-03); the same family as
# `tray-icon`. Linux registers under X11 only, through x11rb, which `arboard` links already.
global-hotkey = "0.8"
governor = "0.10"
hex = "0.4"
hmac = "0.13"
httpdate = "1"
# The provider is pinned to aws-lc-rs on purpose: lettre's `rustls-tls` would pull in
# `ring` alongside the `aws-lc-rs` reqwest already uses, and rustls then refuses to pick a
# process-wide provider at all.
lettre = { version = "0.11", default-features = false, features = ["aws-lc-rs", "builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"] }
keyring = "4.1.6"
# XZ decompression for the managed-tool archives (RD-102-04). Pure Rust and decoder-only:
# unpacking bytes fetched from a release host is exactly the place not to link liblzma.
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }
md-5 = "0.11"
mime_guess = "2"
# Interface enumeration for torrent binding; librqbit links the same crate for UPnP.
network-interface = "2"
notify = "8"
# Arbitrary-precision integers for the guest-side RSA of `plugins/mega-auth` (`src/rsa.rs`),
# and for `plugins/mega-login-probe`, which measures what that private operation costs.
num-bigint = "0.5"
# Desktop toasts for the capture agent. `z` selects the pure-Rust zbus backend on Linux
# instead of the default libdbus binding, so no C library has to be present for the
# cross-builds; Windows and macOS use their own backends regardless.
notify-rust = { version = "4", default-features = false, features = ["z"] }
# S3-compatible object storage (RD-150-04): signing, multipart and the credential providers of
# the Apache Arrow project, on the reqwest, rustls and aws-lc-rs this workspace already links.
# Azure and GCS are features of the same crate, which RD-150-05 switches on.
# OpenID Connect sign-in (RD-190-15, ADR 0021): discovery, key set, ID-token verification, PKCE
# and the code exchange. Without its own HTTP stack — `rd_api_core::oidc_client` hands it the
# workspace's reqwest.
openidconnect = { version = "4", default-features = false }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
open = "5.4.2"
percent-encoding = "2.3"
# Decodes the capture agent's tray icon; replaces `image`, which wrapped this same crate. On macOS
# `tray-icon` and `muda` link it anyway.
png = "0.18"
# Mozilla's Public Suffix List, compiled in: an imported cookie for `com` or `co.uk` is refused
# (RD-120-49). No runtime fetch; a list update is a dependency update.
psl = "2.1"
quick-xml = "0.42"
rand = "0.10"
regex = "1"
# The parser `regex` compiles with, for the regex editor's diagram of a pattern (RD-1140-06).
regex-syntax = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "gzip", "http2", "json", "multipart", "rustls", "socks", "stream"] }
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rust-embed = { version = "8", features = ["axum"] }
# The terminal's echo switched off for `rdownloader auth reset-password --prompt` (RD-190-24):
# already in the tree beneath tempfile and others, so only its `termios` feature is new.
rustix = { version = "1.1", default-features = false, features = ["std", "termios"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
rustls = "0.23"
rustls-platform-verifier = "0.7"
rust-par2 = "0.1.3"
russh = "0.63"
russh-sftp = "3"
secrecy = { version = "0.10", features = ["serde"] }
subtle = "2.6"
zeroize = "1.9"
semver = "1"
sevenz-rust2 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
sha1 = "0.11"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
# `deprecated` is what gates `connect_secure_implicit`, i.e. implicit FTPS on port 990.
# It is deprecated as a protocol, not as an API, and RD-060-01 requires it.
suppaftp = { version = "12", default-features = false, features = ["tokio", "tokio-rustls-aws-lc-rs", "deprecated"] }
tao = "0.37.0"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.26"
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1", features = ["serde", "v7"] }
# The version wasmtime brings (wasmtime 49: 0.258), so the pre-validation adds no second copy;
# raise it together with wasmtime (RD-150-21).
wasmparser = "0.258"
# `cache` keeps compiled plugins on disk between starts and `parallel-compilation` spreads the
# compile a cache miss still costs over the cores (RD-130-06; `rd-plugin-host/src/compile_cache.rs`).
wasmtime = { version = "49.0.1", default-features = false, features = ["anyhow", "async", "cache", "component-model", "component-model-async", "cranelift", "parallel-compilation", "runtime", "std"] }
webauthn-rs = "0.6.1-dev"
# Test-only: a software authenticator, so the passkey ceremonies can be driven end to end
# rather than mocked. Pinned to the same line as webauthn-rs so the two share their
# protocol types; a version skew here would compare structurally identical types that the
# compiler considers unrelated.
webauthn-authenticator-rs = { version = "0.6.1-dev", features = ["softtoken"] }
# Windows only: the link count of an unpacked file (RD-190-05), through `GetFileInformationByHandle`
# behind a safe call. Already in the tree through `walkdir`/`same-file`, so it adds no crate.
winapi-util = "0.1.11"
wit-bindgen = "0.62"
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Test packages and the host tools (RD-150-20): optimised like a release, but in parallel code
# units and without LTO, which is what made a release build wait on one core. Published releases
# keep `release`; `scripts/package-*.sh --profile release-test` builds the owner's test packages
# and `scripts/build-plugins.sh` its packager `rd-pack` with this one.
[profile.release-test]
inherits = "release"
codegen-units = 16
lto = false

[profile.dev]
debug = "line-tables-only"          # Backtraces bleiben, DWARF schrumpft massiv
split-debuginfo = "unpacked"        # dedupliziert Debug-Info statt sie zu kopieren

# The WebAssembly compiler optimised in test builds too (RD-1100-13). Every contract test compiles
# real plugin components with Cranelift, and unoptimised that is most of their time: 1203 s for
# 933 tests on GitHub, and compiling the 72 bundled plugins took about seven minutes in a debug
# build against 34 s in a release one (crates/rd-plugin-host/src/compile_cache.rs). Only the crates that run at run time — not the build-time generators
# (`*-meta`, `cranelift-isle`, `cranelift-srcgen`) or the proc macros, which would only compile
# slower. A profile override takes one package name each, no pattern.
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-codegen-shared]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-core]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
# The hashes and key derivations optimised in test builds too (RD-1120-08): unoptimised, a test that
# hashes a password (`Argon2::default()`), seals a backup or derives a plugin key
# (`MIN_PBKDF2_ROUNDS`) spends seconds in them. An override applies to every version of a name.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
# SQLite itself: `sqlx`'s `sqlite` feature builds the bundled amalgamation with `cc`, which takes the
# package's `OPT_LEVEL` — `-O0` without this line, and every test opens databases.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
